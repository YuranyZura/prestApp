<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrestApp | Clientes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/styles.min.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
  background:#f5f7fa;
}

.sidebar{
  min-height:100vh;
  background:#111827;
}

.sidebar .brand{
  font-size:24px;
  font-weight:700;
  color:#fff;
}

.sidebar a,
.sidebar button{
  width:100%;
  display:block;
  text-align:left;
  border:none;
  background:none;
  color:#e5e7eb;
  text-decoration:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:8px;
  transition:.25s;
}

.sidebar a:hover,
.sidebar button:hover{
  background:#1f2937;
}

.sidebar .active{
  background:#0d6efd;
  color:#fff;
}

.card-pro{
  border:none;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
}

.table thead{
  background:#0d6efd;
  color:#fff;
}

.badge-ok{
  background:#198754;
}

.badge-loan{
  background:#ffc107;
  color:#000;
}

@media (max-width:768px){

.sidebar{
  min-height:0;
  height:auto;
}

}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<aside class="col-lg-2 sidebar p-3">

<div class="brand mb-4">
PrestApp
</div>

<nav id="menuSidebar">

<a href="/dashboard">Dashboard</a>

<a href="/dashboard/clientes" class="active">
Clientes
</a>

<a href="/dashboard/prestamos">
Préstamos
</a>

<a href="/dashboard/pagos">
Pagos
</a>

<a href="/dashboard/trabajadores" id="menuTrabajadores">
Trabajadores
</a>

</nav>

<hr class="text-secondary">

<button id="btnLogout" class="btn btn-danger mt-2">
Cerrar sesión
</button>

</aside>

<!-- CONTENT -->
<main class="col-lg-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>
<h2 class="fw-bold mb-1">
Clientes
</h2>

<p class="text-muted mb-0">
Administración de clientes registrados
</p>
</div>

<button
type="button"
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalCliente">

<i class="ti ti-user-plus"></i>
Nuevo Cliente

</button>

</div>

<!-- STATS -->
<div class="row g-3 mb-4">

<div class="col-md-3">
<div class="card card-pro p-3">
<div class="text-muted">Total</div>
<h3 id="statTotal">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-pro p-3">
<div class="text-muted">Activos</div>
<h3 id="statActivos">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-pro p-3">
<div class="text-muted">Con préstamo</div>
<h3 id="statPrestamo">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card card-pro p-3">
<div class="text-muted">Nuevos hoy</div>
<h3 id="statHoy">0</h3>
</div>
</div>

</div>

<!-- FILTROS -->
<div class="card card-pro p-3 mb-4">

<div class="row g-3">

<div class="col-md-4">

<label for="buscarCliente" class="form-label">
Buscar
</label>

<input
type="text"
id="buscarCliente"
class="form-control"
placeholder="Nombre o cédula">

</div>

<div class="col-md-3">

<label for="filtroEstado" class="form-label">
Estado
</label>

<select
id="filtroEstado"
class="form-select">

<option value="">Todos</option>
<option value="activo">Activos</option>
<option value="prestamo">Con préstamo</option>

</select>

</div>

<div class="col-md-2 d-grid">

<label class="form-label invisible">.</label>

<button
type="button"
class="btn btn-outline-primary"
onclick="cargarClientes()">

Buscar

</button>

</div>

</div>

</div>

<!-- TABLA -->
<div class="card card-pro p-3">

<div class="table-responsive">

<table class="table align-middle">

<thead>
<tr>
<th>Foto</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Teléfono</th>
<th>Dirección</th>
<th>Estado</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaClientes">

<tr>
<td colspan="7" class="text-center py-4">
Cargando clientes...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalCliente" tabindex="-1">

<div class="modal-dialog modal-lg">
<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Registrar Cliente
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
aria-label="Cerrar">
</button>

</div>

<div class="modal-body">

<form id="formCliente">

<div class="row g-3">

<div class="col-md-6">
<label for="nombreCompleto" class="form-label">
Nombre completo
</label>

<input
type="text"
id="nombreCompleto"
name="nombreCompleto"
class="form-control"
required>
</div>

<div class="col-md-6">
<label for="cedula" class="form-label">
Cédula
</label>

<input
type="text"
id="cedula"
name="cedula"
class="form-control"
required>
</div>

<div class="col-md-6">
<label for="telefono" class="form-label">
Teléfono
</label>

<input
type="text"
id="telefono"
name="telefono"
class="form-control"
required>
</div>

<div class="col-md-6">
<label for="ciudad" class="form-label">
Ciudad
</label>

<input
type="text"
id="ciudad"
name="ciudad"
class="form-control">
</div>

<div class="col-md-12">
<label for="direccion" class="form-label">
Dirección
</label>

<input
type="text"
id="direccion"
name="direccion"
class="form-control"
required>
</div>

<div class="col-md-6">
<label for="fechaNacimiento" class="form-label">
Fecha nacimiento
</label>

<input
type="date"
id="fechaNacimiento"
name="fechaNacimiento"
class="form-control">
</div>

</div>

<div class="mt-4 d-grid">

<button
type="submit"
class="btn btn-primary">

Guardar Cliente

</button>

</div>

</form>

</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "/api";

// ================================
// VALIDAR SESION
// ================================
document.addEventListener("DOMContentLoaded", async ()=>{

try{

const res = await fetch("/api/auth/check",{
credentials:"include"
});

if(!res.ok){
location.href="/login";
return;
}

const data = await res.json();

// ocultar trabajadores si rol trabajador
if(data.usuario.id_rol === 3){
document
.getElementById("menuTrabajadores")
.style.display = "none";
}

}catch(error){
location.href="/login";
return;
}

cargarClientes();

});

// ================================
// CARGAR CLIENTES
// ================================
async function cargarClientes(){

try{

const res = await fetch(`${API}/clientes`,{
credentials:"include"
});

const data = await res.json();

if(!data.success) return;

renderClientes(data.clientes);
stats(data.clientes);

}catch(error){
console.error(error);
}

}

// ================================
// RENDER
// ================================
function renderClientes(lista){

const tbody =
document.getElementById("tablaClientes");

if(!lista.length){

tbody.innerHTML=`
<tr>
<td colspan="7" class="text-center py-4">
No hay clientes
</td>
</tr>
`;

return;
}

tbody.innerHTML = lista.map(c=>`

<tr>

<td>
<img
src="/uploads/${c.foto || 'user.png'}"
class="avatar">
</td>

<td>${c.nombreCompleto}</td>
<td>${c.cedula}</td>
<td>${c.telefono}</td>
<td>${c.direccion}</td>

<td>
<span class="badge badge-ok">
Activo
</span>
</td>

<td>

<a
href="/dashboard/clientes/${c.id_clientes}"
class="btn btn-sm btn-primary">

Ver

</a>

<button
class="btn btn-sm btn-danger"
onclick="eliminarCliente(${c.id_clientes})">

Eliminar

</button>

</td>

</tr>

`).join("");

}

// ================================
// STATS
// ================================
function stats(lista){

document.getElementById("statTotal")
.textContent = lista.length;

document.getElementById("statActivos")
.textContent = lista.length;

document.getElementById("statPrestamo")
.textContent = "0";

document.getElementById("statHoy")
.textContent = "0";

}

// ================================
// CREAR CLIENTE
// ================================
document
.getElementById("formCliente")
.addEventListener("submit", async e=>{

e.preventDefault();

const form = new FormData(e.target);

const body =
Object.fromEntries(form);

const res = await fetch(`${API}/clientes`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
credentials:"include",
body:JSON.stringify(body)
});

const data = await res.json();

if(data.success){

bootstrap.Modal
.getInstance(
document.getElementById("modalCliente")
).hide();

e.target.reset();

cargarClientes();

alert("Cliente creado");

}else{
alert(data.message);
}

});

// ================================
// ELIMINAR
// ================================
async function eliminarCliente(id){

if(!confirm("¿Eliminar cliente?")) return;

const res = await fetch(`${API}/clientes/${id}`,{
method:"DELETE",
credentials:"include"
});

const data = await res.json();

if(data.success){
cargarClientes();
}

}

// ================================
// LOGOUT
// ================================
document
.getElementById("btnLogout")
.addEventListener("click", async ()=>{

await fetch("/api/auth/logout",{
method:"POST",
credentials:"include"
});

localStorage.clear();
sessionStorage.clear();

location.href="/login";

});
</script>

</body>
</html>
