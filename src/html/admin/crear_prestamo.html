<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PrestApp | Nuevo Préstamo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
  background:#f5f7fa;
}

.sidebar{
  min-height:100vh;
  background:#111827;
}

.sidebar h4{
  color:#fff;
  font-weight:700;
}

.sidebar a,
.sidebar button{
  color:#fff;
  text-decoration:none;
  display:block;
  width:100%;
  text-align:left;
  padding:12px 15px;
  border:none;
  background:none;
  border-radius:10px;
  margin-bottom:8px;
  transition:.2s;
}

.sidebar a:hover,
.sidebar button:hover{
  background:#1f2937;
}

.sidebar .active{
  background:#0d6efd;
}

.card-box{
  border:none;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.resumen{
  background:#eef4ff;
  border-radius:14px;
  padding:18px;
}

.total{
  font-size:28px;
  font-weight:700;
  color:#0d6efd;
}

@media (max-width:768px){

.sidebar{
  min-height:0;
  height:auto;
}

}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<aside class="col-lg-2 sidebar p-3">

<h4 class="mb-4">PrestApp</h4>

<a href="/dashboard">Dashboard</a>
<a href="/dashboard/clientes">Clientes</a>
<a href="/dashboard/prestamos">Préstamos</a>
<a href="/dashboard/crear-prestamo" class="active">Nuevo préstamo</a>
<a href="/dashboard/pagos">Pagos</a>
<a href="/dashboard/trabajadores" id="menuTrabajadores">Trabajadores</a>

<hr class="text-secondary">

<button
type="button"
id="btnLogout"
class="btn btn-danger mt-2">

Cerrar sesión

</button>

</aside>

<!-- CONTENT -->
<main class="col-lg-10 p-4">

<div class="mb-4">
<h2 class="fw-bold">Crear Préstamo</h2>
<p class="text-muted mb-0">
Registrar nuevo préstamo para un cliente
</p>
</div>

<div class="row g-4">

<!-- FORM -->
<div class="col-lg-7">

<div class="card card-box p-4">

<form id="formPrestamo">

<div class="mb-3">

<label for="cliente" class="form-label">
Cliente
</label>

<select
id="cliente"
name="id_clientes"
class="form-select"
required>

<option value="">
Cargando clientes...
</option>

</select>

</div>

<div class="mb-3">

<label for="monto" class="form-label">
Monto prestado
</label>

<input
type="number"
id="monto"
name="monto"
class="form-control"
placeholder="Ej: 10000"
required>

</div>

<div class="mb-3">

<label for="interes" class="form-label">
Interés %
</label>

<input
type="number"
id="interes"
name="interes"
class="form-control"
placeholder="Ej: 20"
required>

</div>

<div class="mb-3">

<label for="cuotas" class="form-label">
Número de cuotas
</label>

<input
type="number"
id="cuotas"
name="numero_cuotas"
class="form-control"
placeholder="Ej: 30"
required>

</div>

<div class="mb-3">

<label for="fecha_inicio" class="form-label">
Fecha inicio
</label>

<input
type="date"
id="fecha_inicio"
name="fecha_inicio"
class="form-control"
required>

</div>

<div class="mt-4 d-grid">

<button
type="submit"
class="btn btn-primary">

Guardar Préstamo

</button>

</div>

</form>

</div>

</div>

<!-- RESUMEN -->
<div class="col-lg-5">

<div class="card card-box p-4">

<h5 class="mb-3">
Resumen automático
</h5>

<div class="resumen mb-3">

<div class="small text-muted">
Total a pagar
</div>

<div
id="totalPagar"
class="total">

$0

</div>

</div>

<div class="resumen mb-3">

<div class="small text-muted">
Cuota diaria
</div>

<div
id="cuotaDiaria"
class="total">

$0

</div>

</div>

<div class="resumen">

<div class="small text-muted">
Fecha final estimada
</div>

<div
id="fechaFinal"
class="fw-bold">

--

</div>

</div>

</div>

</div>

</div>

</main>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "/api";

// ===========================
// VALIDAR SESION
// ===========================
document.addEventListener("DOMContentLoaded", async ()=>{

try{

const res = await fetch("/api/auth/check",{
credentials:"include"
});

if(!res.ok){
location.href="/login";
return;
}

const data = await res.json();

// trabajador no ve trabajadores
if(data.usuario.id_rol === 3){
document.getElementById("menuTrabajadores").style.display = "none";
}

}catch(error){

location.href="/login";
return;

}

cargarClientes();

});

// ===========================
// CARGAR CLIENTES
// ===========================
async function cargarClientes(){

try{

const res = await fetch(`${API}/clientes`,{
credentials:"include"
});

const data = await res.json();

if(!data.success) return;

const select =
document.getElementById("cliente");

select.innerHTML =
'<option value="">Seleccione cliente</option>';

data.clientes.forEach(c=>{

select.innerHTML += `
<option value="${c.id_clientes}">
${c.nombreCompleto}
</option>
`;

});

}catch(error){
console.error(error);
}

}

// ===========================
// CALCULAR PRESTAMO
// ===========================
function calcularPrestamo(){

const monto =
parseFloat(document.getElementById("monto").value) || 0;

const interes =
parseFloat(document.getElementById("interes").value) || 0;

const cuotas =
parseInt(document.getElementById("cuotas").value) || 0;

const fechaInicio =
document.getElementById("fecha_inicio").value;

const total =
monto + (monto * interes / 100);

const cuota =
cuotas > 0 ? total / cuotas : 0;

document.getElementById("totalPagar")
.textContent =
"$" + total.toFixed(2);

document.getElementById("cuotaDiaria")
.textContent =
"$" + cuota.toFixed(2);

if(fechaInicio && cuotas > 0){

const fecha =
new Date(fechaInicio);

fecha.setDate(
fecha.getDate() + cuotas
);

document.getElementById("fechaFinal")
.textContent =
fecha.toLocaleDateString();

}else{

document.getElementById("fechaFinal")
.textContent = "--";

}

}

// ===========================
// EVENTOS
// ===========================
["monto","interes","cuotas","fecha_inicio"]
.forEach(id=>{

document
.getElementById(id)
.addEventListener("input",calcularPrestamo);

});

// ===========================
// GUARDAR
// ===========================
document
.getElementById("formPrestamo")
.addEventListener("submit", async e=>{

e.preventDefault();

const body = {

id_clientes:
document.getElementById("cliente").value,

monto:
document.getElementById("monto").value,

interes:
document.getElementById("interes").value,

numero_cuotas:
document.getElementById("cuotas").value,

fecha_inicio:
document.getElementById("fecha_inicio").value

};

try{

const res = await fetch(`${API}/prestamos`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
credentials:"include",
body:JSON.stringify(body)
});

const data = await res.json();

if(data.success){

alert("Préstamo creado correctamente");

document
.getElementById("formPrestamo")
.reset();

calcularPrestamo();

}else{

alert(data.message || "Error");

}

}catch(error){

alert("Error del servidor");

}

});

// ===========================
// LOGOUT
// ===========================
document
.getElementById("btnLogout")
.addEventListener("click", async ()=>{

await fetch("/api/auth/logout",{
method:"POST",
credentials:"include"
});

localStorage.clear();
sessionStorage.clear();

location.href="/login";

});
</script>

</body>
</html>
