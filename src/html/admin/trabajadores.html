<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <!-- ✅ Viewport corregido (sin maximum-scale) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PrestApp - Trabajadores</title>

  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/administradores.css" />

  <!-- Iconos -->
  <link rel="stylesheet" href="../assets/css/icons/tabler-icons/tabler-icons.css" />
</head>

<body>

<div class="page-wrapper" id="main-wrapper">

  <!-- SIDEBAR -->
  <aside class="left-sidebar">
    <div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
        <a href="./index.html" class="text-nowrap logo-img" title="Ir al Dashboard">
          <img src="../assets/images/logos/prestapp-remove.png" width="180" alt="Logo PrestApp">
        </a>
        <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
          <i class="ti ti-x fs-8"></i>
        </div>
      </div>

      <nav class="sidebar-nav scroll-sidebar">
        <ul id="sidebarnav">
          <li class="nav-small-cap">
            <span class="hide-menu">Inicio</span>
          </li>

          <li class="sidebar-item">
            <a class="sidebar-link" href="./index.html">
              <i class="ti ti-layout-dashboard"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li class="nav-small-cap">
            <span class="hide-menu">Gestión</span>
          </li>

          <li class="sidebar-item">
            <a class="sidebar-link active" href="./trabajadores.html">
              <i class="ti ti-users"></i>
              <span>Trabajadores</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="body-wrapper">

    <!-- HEADER -->
    <header class="app-header">
      <nav class="navbar navbar-expand-lg navbar-light">

        <ul class="navbar-nav">
          <li class="nav-item d-block d-xl-none">
            <button class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" title="Abrir menú">
              <i class="ti ti-menu-2"></i>
            </button>
          </li>

          <li class="nav-item">
            <button class="nav-link nav-icon-hover" title="Notificaciones">
              <i class="ti ti-bell-ringing"></i>
            </button>
          </li>
        </ul>

        <div class="navbar-collapse justify-content-end">
          <ul class="navbar-nav flex-row align-items-center">

            <li class="nav-item dropdown">
              <button class="nav-link nav-icon-hover" data-bs-toggle="dropdown" title="Menú usuario">
                <img src="../assets/images/profile/user-1.jpg"
                     alt="Foto de usuario"
                     width="35"
                     height="35"
                     class="rounded-circle">
              </button>

              <div class="dropdown-menu dropdown-menu-end">
                <button class="dropdown-item">
                  <i class="ti ti-user"></i> Mi Perfil
                </button>

                <button id="btnCerrarSesion" class="btn btn-outline-primary m-2">
                  Cerrar Sesión
                </button>
              </div>
            </li>

          </ul>
        </div>
      </nav>
    </header>

    <!-- CONTENIDO -->
    <div class="container-fluid">

      <!-- HEADER -->
      <div class="page-header d-flex justify-content-between align-items-center">
        <div>
          <h4 class="fw-bold">Gestión de Trabajadores</h4>
          <p class="text-muted">Administra tu equipo</p>
        </div>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAgregarTrabajador" title="Agregar trabajador">
          <i class="ti ti-plus"></i> Agregar
        </button>
      </div>

      <!-- TABLA -->
      <div class="card">
        <div class="card-header">
          <input type="text"
                 id="buscadorTrabajadores"
                 class="form-control"
                 placeholder="Buscar trabajador..."
                 title="Buscar trabajador">
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">

            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Cédula</th>
                  <th>Nombre</th>
                  <th>Teléfono</th>
                  <th>Correo</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaTrabajadores"></tbody>

            </table>

          </div>

          <!-- SIN RESULTADOS -->
          <div id="mensajeSinResultados" class="text-center d-none p-4">
            <i class="ti ti-user-off fs-1 text-muted"></i>
            <p>No hay trabajadores</p>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalAgregarTrabajador">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Agregar Trabajador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar ventana" title="cerrar ventana" > </button>
      </div>

      <div class="modal-body">
        <form id="formularioTrabajador">

          <label for="nombre">Nombre</label>
          <input id="nombre" class="form-control mb-2" required>

          <label for="apellido">Apellido</label>
          <input id="apellido" class="form-control mb-2" required>

          <label for="cedula">Cédula</label>
          <input id="cedula" class="form-control mb-2" required>

          <label for="celular">Celular</label>
          <input id="celular" class="form-control mb-2" required>

          <label for="correo">Correo</label>
          <input type="email" id="correo" class="form-control mb-2" required>

          <label for="foto">Foto</label>
          <input type="file" id="foto" class="form-control">

        </form>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardarTrabajador">Guardar</button>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../assets/js/sidebarmenu.js"></script>
<script src="../assets/js/app.min.js"></script>
<script src="../assets/js/trabajadores.js"></script>

</body>
</html>
