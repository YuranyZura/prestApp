<!-- HEADER -->
<header class="app-header">
  <nav class="navbar navbar-light px-3">

    <button 
      class="btn btn-light d-md-none"
      aria-label="Abrir menú"
      id="btnMenu">
      <i class="ti ti-menu-2"></i>
    </button>

    <div class="ms-auto d-flex align-items-center gap-2">

      <button 
        class="btn btn-light"
        aria-label="Notificaciones"
        title="Notificaciones">
        <i class="ti ti-bell"></i>
      </button>

      <img 
        src="/assets/images/profile/user-1.jpg"
        alt="Usuario"
        class="rounded-circle"
        width="35"
        height="35">

    </div>
  </nav>
</header>

<!-- CONTENIDO PRINCIPAL -->
<div class="container-fluid">

  <!-- BOTÓN VOLVER -->
  <div class="mb-3">
    <button 
      class="btn btn-light d-flex align-items-center gap-1"
      aria-label="Volver a trabajadores">

      <i class="ti ti-arrow-left"></i>
      <span>Volver</span>
    </button>
  </div>

  <div class="row">

    <!-- INFO PRINCIPAL -->
    <div class="col-lg-8">

      <!-- DATOS -->
      <div class="card mb-3">
        <div class="card-body">

          <h5 class="fw-bold mb-3">
            <i class="ti ti-user"></i> Información del Trabajador
          </h5>

          <div class="row">
            <div class="col-md-4 text-center">
              <img 
                id="fotoTrabajador"
                src="https://via.placeholder.com/120"
                alt="Foto del trabajador"
                class="rounded-circle"
                width="120"
                height="120">
            </div>

            <div class="col-md-8">

              <p><strong>Nombre:</strong> <span id="nombreTrabajador">-</span></p>
              <p><strong>Cédula:</strong> <span id="cedulaTrabajador">-</span></p>
              <p><strong>Teléfono:</strong> <span id="telefonoTrabajador">-</span></p>

            </div>
          </div>

        </div>
      </div>

      <!-- HISTORIAL -->
      <div class="card">
        <div class="card-body">

          <h5 class="fw-bold mb-3">
            <i class="ti ti-history"></i> Actividad
          </h5>

          <div class="table-responsive">
            <table class="table">

              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Acción</th>
                  <th>Detalle</th>
                </tr>
              </thead>

              <tbody id="tablaActividad">
                <tr>
                  <td colspan="3" class="text-center text-muted">
                    No hay registros
                  </td>
                </tr>
              </tbody>

            </table>
          </div>

        </div>
      </div>

    </div>

    <!-- SIDEBAR DERECHO -->
    <div class="col-lg-4">

      <!-- ESTADO -->
      <div class="card mb-3">
        <div class="card-body">

          <h6 class="fw-bold">Estado</h6>

          <span class="badge bg-success" id="estadoTrabajador">
            Activo
          </span>

        </div>
      </div>

      <!-- ACCIONES -->
      <div class="card">
        <div class="card-body">

          <h6 class="fw-bold mb-3">Acciones</h6>

          <div class="d-grid gap-2">

            <button class="btn btn-primary">
              <i class="ti ti-edit"></i> Editar
            </button>

            <button class="btn btn-danger">
              <i class="ti ti-trash"></i> Eliminar
            </button>

          </div>

        </div>
      </div>

    </div>

  </div>

</div>
