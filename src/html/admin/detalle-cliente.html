<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PrestApp | Detalle Cliente</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
body{
  background:#f5f7fa;
}

.sidebar{
  min-height:100vh;
  background:#111827;
}

.sidebar h4{
  color:#fff;
  font-weight:700;
}

.sidebar a,
.sidebar button{
  width:100%;
  display:block;
  border:none;
  background:none;
  color:#fff;
  text-decoration:none;
  text-align:left;
  padding:12px 15px;
  border-radius:10px;
  margin-bottom:8px;
  transition:.2s;
}

.sidebar a:hover,
.sidebar button:hover{
  background:#1f2937;
}

.sidebar .active{
  background:#0d6efd;
}

.card-box{
  border:none;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.foto-cliente{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #eef1f5;
}

#mapaCliente{
  width:100%;
  height:350px;
  border-radius:14px;
}

.stat{
  font-size:24px;
  font-weight:700;
}

@media (max-width:768px){

.sidebar{
  min-height:0;
  height:auto;
}

#mapaCliente{
  height:280px;
}

}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<aside class="col-lg-2 sidebar p-3">

<h4 class="mb-4">PrestApp</h4>

<a href="/dashboard">Dashboard</a>
<a href="/dashboard/clientes" class="active">Clientes</a>
<a href="/dashboard/prestamos">Préstamos</a>
<a href="/dashboard/pagos">Pagos</a>
<a href="/dashboard/trabajadores" id="menuTrabajadores">Trabajadores</a>

<hr class="text-secondary">

<button
type="button"
id="btnLogout"
class="btn btn-danger mt-2">

Cerrar sesión

</button>

</aside>

<!-- CONTENT -->
<main class="col-lg-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<button
type="button"
id="btnVolver"
class="btn btn-light">

<i class="ti ti-arrow-left"></i>
Volver

</button>

<h3 class="fw-bold mb-0">
Detalle Cliente
</h3>

<div></div>

</div>

<div class="row g-4">

<!-- LEFT -->
<div class="col-lg-8">

<!-- INFO -->
<div class="card card-box p-4 mb-4">

<h5 class="mb-4">
<i class="ti ti-user"></i>
Información General
</h5>

<div class="text-center mb-4">

<img
id="fotoCliente"
src="/uploads/user.png"
alt="Foto cliente"
class="foto-cliente">

</div>

<div class="row g-3">

<div class="col-md-6">
<strong>Nombre:</strong><br>
<span id="nombreCliente">-</span>
</div>

<div class="col-md-6">
<strong>Cédula:</strong><br>
<span id="cedulaCliente">-</span>
</div>

<div class="col-md-6">
<strong>Teléfono:</strong><br>
<span id="telefonoCliente">-</span>
</div>

<div class="col-md-6">
<strong>Dirección:</strong><br>
<span id="direccionCliente">-</span>
</div>

</div>

</div>

<!-- MAPA -->
<div class="card card-box p-4 mb-4">

<h5 class="mb-3">
<i class="ti ti-map-pin"></i>
Ubicación
</h5>

<div id="mapaCliente"></div>

</div>

<!-- PRESTAMOS -->
<div class="card card-box p-4">

<h5 class="mb-3">
<i class="ti ti-cash"></i>
Préstamos
</h5>

<div class="table-responsive">

<table class="table align-middle">

<thead>
<tr>
<th>Monto</th>
<th>Fecha</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tablaPrestamos">

<tr>
<td colspan="3" class="text-center py-3">
Sin datos
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- RIGHT -->
<div class="col-lg-4">

<!-- RESUMEN -->
<div class="card card-box p-4 mb-4">

<h5 class="mb-3">
Resumen
</h5>

<div class="mb-3">
Pagadas<br>
<div id="cuotasPagadas" class="stat text-success">0</div>
</div>

<div class="mb-3">
Pendientes<br>
<div id="cuotasPendientes" class="stat text-warning">0</div>
</div>

<div>
Mora<br>
<div id="cuotasMora" class="stat text-danger">0</div>
</div>

</div>

<!-- ACTIONS -->
<div class="card card-box p-4">

<button
type="button"
id="btnRegistrarPago"
class="btn btn-primary w-100 mb-2">

Registrar Pago

</button>

<button
type="button"
id="btnNuevoPrestamo"
class="btn btn-success w-100 mb-2">

Nuevo Préstamo

</button>

<button
type="button"
id="btnEditar"
class="btn btn-warning w-100 mb-2">

Editar Cliente

</button>

<button
type="button"
id="btnEliminar"
class="btn btn-danger w-100">

Eliminar Cliente

</button>

</div>

</div>

</div>

</main>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
const API = "/api";
let mapa;
let marker;

// =====================================
// INIT
// =====================================
document.addEventListener("DOMContentLoaded", async ()=>{

try{

const res = await fetch("/api/auth/check",{
credentials:"include"
});

if(!res.ok){
location.href="/login";
return;
}

const auth = await res.json();

if(auth.usuario.id_rol === 3){
document.getElementById("menuTrabajadores").style.display="none";
}

}catch(error){
location.href="/login";
return;
}

const id = new URLSearchParams(location.search).get("id");

if(!id){
location.href="/dashboard/clientes";
return;
}

initMap();
cargarCliente(id);
eventos(id);

});

// =====================================
// MAPA
// =====================================
function initMap(){

mapa = L.map("mapaCliente").setView([10.9878,-74.7889],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(mapa);

marker = L.marker([10.9878,-74.7889]).addTo(mapa);

}

// =====================================
// CARGAR CLIENTE
// =====================================
async function cargarCliente(id){

try{

const res = await fetch(`${API}/clientes/${id}`,{
credentials:"include"
});

const data = await res.json();

if(!data.success){
alert("Cliente no encontrado");
location.href="/dashboard/clientes";
return;
}

const c = data.cliente;

document.getElementById("nombreCliente").textContent =
c.nombreCompleto || "-";

document.getElementById("cedulaCliente").textContent =
c.cedula || "-";

document.getElementById("telefonoCliente").textContent =
c.telefono || "-";

document.getElementById("direccionCliente").textContent =
c.direccion || "-";

document.getElementById("fotoCliente").src =
"/uploads/" + (c.foto || "user.png");

// mapa real
if(c.latitud && c.longitud){

const lat = parseFloat(c.latitud);
const lng = parseFloat(c.longitud);

mapa.setView([lat,lng],15);
marker.setLatLng([lat,lng]);

}

// resumen cuotas
cargarResumen(id);

// prestamos
renderPrestamos(data.prestamos || []);

}catch(error){

console.error(error);

}

}

// =====================================
// RESUMEN
// =====================================
async function cargarResumen(id){

try{

const res = await fetch(`${API}/clientes/${id}/cuotas`,{
credentials:"include"
});

const data = await res.json();

if(!data.success) return;

const r = data.resumen;

document.getElementById("cuotasPagadas").textContent =
r.cuotasPagadas;

document.getElementById("cuotasPendientes").textContent =
r.cuotasPendientes;

document.getElementById("cuotasMora").textContent =
r.cuotasMora;

}catch(error){
console.error(error);
}

}

// =====================================
// TABLA PRESTAMOS
// =====================================
function renderPrestamos(lista){

const tbody =
document.getElementById("tablaPrestamos");

if(!lista.length){

tbody.innerHTML=`
<tr>
<td colspan="3" class="text-center">
Sin préstamos
</td>
</tr>
`;

return;
}

tbody.innerHTML = lista.map(p=>`

<tr>

<td>$${Number(p.monto).toLocaleString()}</td>

<td>
${new Date(p.fecha_inicio).toLocaleDateString()}
</td>

<td>
<span class="badge bg-primary">
${p.estado_formateado || p.estado}
</span>
</td>

</tr>

`).join("");

}

// =====================================
// EVENTOS
// =====================================
function eventos(id){

document.getElementById("btnVolver")
.addEventListener("click",()=>{
location.href="/dashboard/clientes";
});

document.getElementById("btnRegistrarPago")
.addEventListener("click",()=>{
location.href=`/dashboard/pagos?id=${id}`;
});

document.getElementById("btnNuevoPrestamo")
.addEventListener("click",()=>{
location.href=`/dashboard/crear-prestamo?id=${id}`;
});

document.getElementById("btnEditar")
.addEventListener("click",()=>{
alert("Módulo editar próximamente");
});

document.getElementById("btnEliminar")
.addEventListener("click", async ()=>{

if(!confirm("¿Eliminar cliente?")) return;

const res = await fetch(`${API}/clientes/${id}`,{
method:"DELETE",
credentials:"include"
});

const data = await res.json();

if(data.success){
alert("Cliente eliminado");
location.href="/dashboard/clientes";
}else{
alert(data.message);
}

});

document.getElementById("btnLogout")
.addEventListener("click", async ()=>{

await fetch("/api/auth/logout",{
method:"POST",
credentials:"include"
});

localStorage.clear();
sessionStorage.clear();

location.href="/login";

});

}
</script>

</body>
</html>
