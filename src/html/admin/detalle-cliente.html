<div class="row">

  <!-- IZQUIERDA -->
  <div class="col-lg-8">

    <!-- INFO CLIENTE -->
    <div class="card p-3 mb-3">
      <h5><i class="ti ti-user"></i> Información</h5>

      <div class="text-center mb-3">
        <img id="fotoCliente" src="https://via.placeholder.com/120" alt ="Foto Cliente"
          class="rounded-circle" width="120" height="120">
      </div>

      <p><strong>Nombre:</strong> <span id="nombreCliente">-</span></p>
      <p><strong>Cédula:</strong> <span id="cedulaCliente">-</span></p>
      <p><strong>Teléfono:</strong> <span id="telefonoCliente">-</span></p>
      <p><strong>Dirección:</strong> <span id="direccionCliente">-</span></p>
    </div>

    <!-- MAPA -->
    <div class="card p-3 mb-3">
      <h5><i class="ti ti-map"></i> Ubicación</h5>
      <div id="mapaCliente" class="mapa-cliente"></div>
    </div>

    <!-- PRESTAMOS -->
    <div class="card p-3">
      <h5><i class="ti ti-file"></i> Préstamos</h5>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaPrestamos">
            <tr><td colspan="3">Sin datos</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- DERECHA -->
  <div class="col-lg-4">

    <!-- RESUMEN -->
    <div class="card p-3 mb-3">
      <h5>Resumen</h5>
      <p>Pagadas: <span id="cuotasPagadas">0</span></p>
      <p>Pendientes: <span id="cuotasPendientes">0</span></p>
      <p>Mora: <span id="cuotasMora">0</span></p>
    </div>

    <!-- ACCIONES -->
    <div class="card p-3">
      <button id="btnRegistrarPago" class="btn btn-primary w-100 mb-2">
        Registrar Pago
      </button>

      <button id="btnNuevoPrestamo" class="btn btn-success w-100 mb-2">
        Nuevo Préstamo
      </button>

      <button id="btnEditar" class="btn btn-warning w-100 mb-2">
        Editar
      </button>

      <button id="btnEliminar" class="btn btn-danger w-100">

    abrirRegistroPago();

    abrirNuevoPrestamo();
