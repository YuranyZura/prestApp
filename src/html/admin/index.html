<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>PrestApp | Dashboard</title>

<meta
  name="description"
  content="Panel principal administrativo PrestApp"
>

<link
  rel="shortcut icon"
  href="/assets/images/logos/favicon.png"
>

<link
  rel="stylesheet"
  href="/assets/css/styles.min.css"
>

<link
  rel="stylesheet"
  href="/assets/css/icons/tabler-icons/tabler-icons.css"
>

<link
  rel="stylesheet"
  href="/assets/css/layout/sidebar.css"
>

<link
  rel="stylesheet"
  href="/assets/css/layout/cards.css"
>

<link
  rel="stylesheet"
  href="/assets/css/layout/mobiles.css"
>

<link
  rel="stylesheet"
  href="/assets/css/pages/dashboard.css"
>

</head>

<body>

<!-- OVERLAY MOBILE -->
<div
  id="sidebarOverlay"
  class="sidebar-overlay"
></div>

<div class="page-wrapper">

  <!-- SIDEBAR -->
  <aside
    class="left-sidebar"
    id="sidebar"
  >

    <div class="brand-logo">

      <img
        src="/assets/images/logos/prestapp-remove.png"
        alt="Logo PrestApp"
        class="logo-img"
      >

    </div>

    <nav id="menuSidebar">

      <a
        href="/dashboard"
        class="sidebar-link active"
      >
        <i class="ti ti-layout-dashboard"></i>
        <span>Dashboard</span>
      </a>

      <a
        href="/html/admin/clientes.html"
        class="sidebar-link"
      >
        <i class="ti ti-users"></i>
        <span>Clientes</span>
      </a>

      <a
        href="/html/admin/prestamos.html"
        class="sidebar-link"
      >
        <i class="ti ti-cash"></i>
        <span>Préstamos</span>
      </a>

      <a
        href="/html/admin/pagos.html"
        class="sidebar-link"
      >
        <i class="ti ti-credit-card"></i>
        <span>Pagos</span>
      </a>

      <a
        href="/html/admin/administradores.html"
        class="sidebar-link only-admin d-none"
      >
        <i class="ti ti-user-star"></i>
        <span>Usuarios</span>
      </a>

    </nav>

    <div class="sidebar-footer">

      <button
        type="button"
        id="btnLogout"
        class="btn btn-danger w-100"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <i class="ti ti-logout"></i>
        Cerrar sesión
      </button>

    </div>

  </aside>

  <!-- CONTENT -->
  <div class="body-wrapper">

    <!-- HEADER -->
    <header class="app-header">

      <nav class="navbar px-3">

        <button
          type="button"
          class="btn btn-light d-lg-none"
          id="btnMenu"
          title="Abrir menú"
          aria-label="Abrir menú lateral"
        >
          <i class="ti ti-menu-2"></i>
        </button>

        <div class="ms-auto d-flex align-items-center gap-3">

          <span
            id="badgeRol"
            class="badge bg-primary badge-role"
          >
            Usuario
          </span>

          <img
            src="/assets/images/profile/user-1.jpg"
            alt="Usuario logueado"
            width="40"
            height="40"
            class="rounded-circle"
          >

        </div>

      </nav>

    </header>

    <!-- MAIN -->
    <main class="container-fluid p-4">

      <!-- TITULO -->
      <div class="mb-4">

        <h1 class="fw-bold mb-1">
          Dashboard
        </h1>

        <p class="text-muted mb-0">
          Resumen general del sistema PrestApp
        </p>

      </div>

      <!-- STATS -->
      <div class="row g-3 mb-4">

        <div class="col-6 col-lg-3">

          <div class="card stat-card p-3 text-center">

            <h3 id="totalClientes">0</h3>

            <p>Clientes</p>

          </div>

        </div>

        <div class="col-6 col-lg-3">

          <div class="card stat-card p-3 text-center">

            <h3 id="totalPrestamos">0</h3>

            <p>Préstamos</p>

          </div>

        </div>

        <div class="col-6 col-lg-3">

          <div class="card stat-card p-3 text-center">

            <h3 id="prestamosActivos">0</h3>

            <p>Activos</p>

          </div>

        </div>

        <div class="col-6 col-lg-3">

          <div class="card stat-card p-3 text-center">

            <h3 id="montoTotal">$0</h3>

            <p>Monto total</p>

          </div>

        </div>

      </div>

      <!-- GRAFICA -->
      <div class="card p-4 mb-4">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

          <h5 class="mb-0">
            Resumen mensual
          </h5>

          <button
            type="button"
            class="btn btn-outline-primary btn-sm"
            id="btnRecargar"
            title="Actualizar datos"
            aria-label="Actualizar datos"
          >
            Actualizar
          </button>

        </div>

        <div
          id="chartResumen"
          class="chart-box"
        ></div>

      </div>

      <!-- INFO -->
      <div class="row g-3">

        <div class="col-lg-6">

          <div class="card p-4 h-100">

            <h5>
              Accesos rápidos
            </h5>

            <div class="d-grid gap-2 mt-3">

              <a
                href="/html/admin/clientes.html"
                class="btn btn-primary"
              >
                Clientes
              </a>

              <a
                href="/html/admin/crear_prestamo.html"
                class="btn btn-success"
              >
                Nuevo préstamo
              </a>

              <a
                href="/html/admin/pagos.html"
                class="btn btn-warning"
              >
                Registrar pago
              </a>

            </div>

          </div>

        </div>

        <div class="col-lg-6">

          <div class="card p-4 h-100">

            <h5>
              Información
            </h5>

            <p class="mb-2">
              Rol actual:
              <strong id="textoRol">-</strong>
            </p>

            <p class="mb-2">
              Sesión activa:
              <strong class="text-success">
                Correcta
              </strong>
            </p>

            <p class="mb-0">
              Fecha:
              <strong id="fechaActual"></strong>
            </p>

          </div>

        </div>

      </div>

    </main>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/assets/libs/apexcharts/dist/apexcharts.min.js"></script>

<script>

const API = "/api";

let chart = null;

// ======================================
// INIT
// ======================================
document.addEventListener("DOMContentLoaded", async ()=>{

  mostrarFecha();

  sidebarMobile();

  await validarSesion();

  await cargarResumen();

});

// ======================================
// FECHA
// ======================================
function mostrarFecha(){

  document.getElementById("fechaActual")
  .textContent =
  new Date().toLocaleDateString("es-CO");

}

// ======================================
// VALIDAR LOGIN
// ======================================
async function validarSesion(){

  try{

    const res = await fetch("/api/auth/check",{
      credentials:"include"
    });

    if(!res.ok){
      location.href="/login";
      return;
    }

    const data = await res.json();

    aplicarRol(data.usuario);

  }catch(error){

    console.error(error);

    location.href="/login";

  }

}

// ======================================
// ROLES
// ======================================
function aplicarRol(usuario){

  const badge =
  document.getElementById("badgeRol");

  const texto =
  document.getElementById("textoRol");

  const rol =
  usuario.rol || "TRABAJADOR";

  badge.textContent = rol.toUpperCase();

  texto.textContent = rol.toUpperCase();

  if(
    rol === "superadmin" ||
    rol === "administrador"
  ){

    document
    .querySelectorAll(".only-admin")
    .forEach(e=>e.classList.remove("d-none"));

  }

}

// ======================================
// RESUMEN
// ======================================
async function cargarResumen(){

  try{

    const res =
    await fetch(`${API}/dashboard/resumen`,{
      credentials:"include"
    });

    const data = await res.json();

    if(!data.success){
      return;
    }

    document.getElementById("totalClientes")
    .textContent =
    data.totalClientes || 0;

    document.getElementById("totalPrestamos")
    .textContent =
    data.totalPrestamos || 0;

    document.getElementById("prestamosActivos")
    .textContent =
    data.activos || 0;

    document.getElementById("montoTotal")
    .textContent =
    "$" +
    Number(data.montoTotal || 0)
    .toLocaleString("es-CO");

    crearGrafica(data.grafica || []);

  }catch(error){

    console.error(error);

  }

}

// ======================================
// GRAFICA
// ======================================
function crearGrafica(datos){

  if(chart){
    chart.destroy();
  }

  const meses =
  datos.length
  ? datos.map(x=>x.mes)
  : ["Ene","Feb","Mar","Abr","May","Jun"];

  const valores =
  datos.length
  ? datos.map(x=>x.total)
  : [1200,1800,1500,2200,1700,2600];

  chart = new ApexCharts(
    document.querySelector("#chartResumen"),
    {
      series:[{
        name:"Monto",
        data:valores
      }],
      chart:{
        type:"bar",
        height:320,
        toolbar:{
          show:false
        }
      },
      plotOptions:{
        bar:{
          borderRadius:8,
          columnWidth:"45%"
        }
      },
      dataLabels:{
        enabled:false
      },
      xaxis:{
        categories:meses
      },
      colors:["#0d6efd"]
    }
  );

  chart.render();

}

// ======================================
// SIDEBAR MOBILE
// ======================================
function sidebarMobile(){

  const btn =
  document.getElementById("btnMenu");

  const sidebar =
  document.getElementById("sidebar");

  const overlay =
  document.getElementById("sidebarOverlay");

  btn.addEventListener("click",()=>{

    sidebar.classList.toggle("show");

    overlay.classList.toggle("show");

  });

  overlay.addEventListener("click",()=>{

    sidebar.classList.remove("show");

    overlay.classList.remove("show");

  });

}

// ======================================
// RECARGAR
// ======================================
document.getElementById("btnRecargar")
.addEventListener("click", cargarResumen);

// ======================================
// LOGOUT
// ======================================
document.getElementById("btnLogout")
.addEventListener("click", async ()=>{

  try{

    await fetch("/api/auth/logout",{
      method:"POST",
      credentials:"include"
    });

  }catch(error){

    console.error(error);

  }

  localStorage.clear();
  sessionStorage.clear();

  location.href = "/login";

});

</script>

</body>
</html>
