<header class="app-header">

<div class="container-fluid">

  <!-- HEADER DE PÁGINA -->
  <div class="mb-4">

  <div class="row g-3 mb-4">

    <div class="col-6 col-lg-3">

  </div>

  <div class="card mb-4">
