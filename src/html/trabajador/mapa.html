<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <!-- Responsive + Android -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO -->
  <meta name="description" content="PrestApp - Ruta del trabajador en tiempo real">
<meta name="theme-color" content="#0d6efd">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>PrestApp - Mapa Trabajador</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="/assets/images/logos/favicon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/styles.min.css">
  <link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    .header-app {
      background: #fff;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0d6efd;
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-name {
      font-weight: 700;
      line-height: 1.1;
    }

    .user-role {
      font-size: .85rem;
      color: #6c757d;
    }

    .content-area {
      flex: 1;
      padding: 1rem;
      padding-bottom: 90px;
    }

    .card-map {
      border: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    #map {
      width: 100%;
      min-height: 68vh;
    }

    .bottom-nav {
      min-height: 72px;
      background: #fff;
      border-top: 1px solid #dee2e6;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav .btn {
      border: 0;
      color: #6c757d;
      width: 100%;
    }

    .bottom-nav .btn.active {
      color: #0d6efd;
      font-weight: 700;
    }

    .nav-label {
      display: block;
      font-size: .75rem;
      margin-top: 2px;
    }

    @media (max-width: 576px) {
      .content-area {
        padding: .75rem;
        padding-bottom: 90px;
      }

      #map {
        min-height: 60vh;
      }
    }
  </style>

  <!-- GOOGLE MAPS -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY"
    async
    defer>
  </script>

</head>

<body>

  <!-- HEADER -->
  <header class="header-app shadow-sm">
    <div class="container-fluid px-3 py-2">

      <div class="d-flex justify-content-between align-items-center gap-3">

        <!-- Usuario -->
        <div class="d-flex align-items-center gap-2">

          <div class="avatar" aria-label="Avatar usuario">
            JD
          </div>

          <div>
            <div class="user-name" id="nombreUsuario">
              Juan Delgado
            </div>

            <div class="user-role">
              Trabajador
            </div>
          </div>

        </div>

        <!-- Salir -->
        <button
          type="button"
          class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1"
          id="btnCerrarSesion"
          aria-label="Cerrar sesión">

          <i class="ti ti-logout"></i>
          <span class="d-none d-sm-inline">Salir</span>

        </button>

      </div>

    </div>
  </header>

  <!-- MAIN -->
  <main class="content-area">

    <!-- MAPA -->
    <section id="panel-mapa" class="app-panel">

      <div class="card card-map">

        <div class="card-header bg-white border-bottom">

          <h1 class="h5 fw-bold mb-0 d-flex align-items-center gap-2">
            <i class="ti ti-map"></i>
            Ubicación en Tiempo Real
          </h1>

        </div>

        <div class="card-body p-0">

          <div
            id="map"
            role="region"
            aria-label="Mapa del trabajador">
          </div>

        </div>

      </div>

    </section>

    <!-- INFO -->
    <section id="panel-info" class="app-panel d-none">

      <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body">

          <h2 class="h5 fw-bold mb-3 d-flex align-items-center gap-2">
            <i class="ti ti-route"></i>
            Información de Ruta
          </h2>

          <div class="row g-3">

            <div class="col-12 col-md-6">
              <div class="border rounded-3 p-3">
                <small class="text-muted d-block">Destino</small>
                <strong>Cliente Principal</strong>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="border rounded-3 p-3">
                <small class="text-muted d-block">Tiempo estimado</small>
                <strong>15 min</strong>
              </div>
            </div>

            <div class="col-12">
              <div class="border rounded-3 p-3">
                <small class="text-muted d-block">Estado</small>
                <strong class="text-success">Activo</strong>
              </div>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- NAV MOBILE -->
  <nav class="navbar fixed-bottom bottom-nav shadow-lg">

    <div class="container-fluid">

      <div class="d-flex justify-content-around w-100">

        <button
          type="button"
          class="btn active nav-btn"
          data-target="mapa">

          <i class="ti ti-map fs-5"></i>
          <span class="nav-label">Mapa</span>

        </button>

        <button
          type="button"
          class="btn nav-btn"
          data-target="info">

          <i class="ti ti-route fs-5"></i>
          <span class="nav-label">Ruta</span>

        </button>

      </div>

    </div>

  </nav>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- MAPA -->
  <script src="/assets/js/mapa.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const botones = document.querySelectorAll(".nav-btn");
      const paneles = document.querySelectorAll(".app-panel");

      botones.forEach(btn => {

        btn.addEventListener("click", () => {

          const destino = btn.dataset.target;

          botones.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          paneles.forEach(p => p.classList.add("d-none"));

          document
            .getElementById("panel-" + destino)
            .classList.remove("d-none");

        });

      });

      document
        .getElementById("btnCerrarSesion")
        .addEventListener("click", () => {

          if (confirm("¿Cerrar sesión?")) {
            window.location.href = "/html/auth/login.html";
          }

        });

    });
  </script>

</body>

</html>
