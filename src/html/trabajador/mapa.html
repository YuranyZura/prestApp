<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PrestApp - Trabajador</title>

    <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="../assets/css/styles.min.css" />
    <link rel="stylesheet" href="../assets/css/icons/tabler-icons/tabler-icons.css" />
    <link rel="stylesheet" href="../assets/css/Rol2_trabajador.css">

    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY"></script>

    <style>
        #map {
            height: 80vh;
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Header con Avatar de Usuario -->
    <div class="app-header">
        <div class="app-header-left">
            <!-- Avatar de usuario en lugar de logo -->
            <div class="user-avatar">
                JD
            </div>
            <div class="user-info">
                <div class="user-info-name" id="userName">Juan Delgado</div>
                <div class="user-info-role">Cobrador</div>
            </div>
        </div>
    
            <button class="btn btn-outline-primary" onclick="cerrarSesion()">
                <i class="ti ti-logout"></i>
                Salir
            </button>
        </div>

    <!-- Main Content -->
    <div class="app-content">
        
        <!-- 1. RUTA DEL DÍA - Clientes de hoy con pago expandible -->
        <section class="app-section active" id="section-mapa">
            <div class="card">
                <div class="card-header bg-light">
                    <h5><i class="ti ti-map"></i> Ruta en Tiempo Real</h5>
                    </div>
                    <div class="card-body">
                        <div id="map"></div>
                    </div>
            </div>
        </section>
          <!-- MENÚ INFERIOR -->
<nav class="navbar fixed-bottom bg-light border-top">
    <div class="d-flex w-100 justify-content-around">

        <!-- 🔥 BOTÓN MAPA -->
        <button class="btn btn-link app-nav-item" onclick="cambiarSeccion('mapa', this)">
            <i class="ti ti-map"></i>
            <div style="font-size: 0.75rem;">Mapa</div>
        </button>

        <button class="btn btn-link app-nav-item active" onclick="cambiarSeccion('ruta', this)">
            <i class="ti ti-route"></i>
            <div style="font-size: 0.75rem;">Ruta</div>
        </button>

    </div>
</nav>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ CORREGIDO -->
<script src="../../js/mapa.js"></script>

<script>
function cambiarSeccion(seccion, btn) {
    document.querySelectorAll(".app-section").forEach(sec => sec.classList.remove("active"));
    document.getElementById("section-" + seccion).classList.add("active");

    document.querySelectorAll(".app-nav-item").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}
</script>

</body>
</html>
