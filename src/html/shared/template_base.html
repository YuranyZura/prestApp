<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
name="description"
content="Plantilla base PrestApp">

<title>PrestApp</title>

<!-- FAVICON -->
<link
rel="shortcut icon"
href="/assets/images/logos/favicon.png">

<!-- CSS -->
<link
rel="stylesheet"
href="/assets/css/styles.min.css">

<link
rel="stylesheet"
href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>

/* =========================================
RESET
========================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#f5f7fa;
font-family:Arial, Helvetica, sans-serif;
overflow-x:hidden;
color:#111827;
}

/* =========================================
LAYOUT
========================================= */

.page-wrapper{
display:flex;
min-height:100vh;
}

/* =========================================
SIDEBAR
========================================= */

.left-sidebar{
width:260px;
background:#ffffff;
border-right:1px solid #e5e7eb;
position:fixed;
top:0;
left:0;
height:100vh;
z-index:1040;
overflow-y:auto;
transition:.3s;
}

.brand-logo{
padding:20px;
text-align:center;
border-bottom:1px solid #f1f1f1;
}

.brand-logo img{
max-width:160px;
height:auto;
}

/* MENU */

.sidebar-nav{
padding:15px 10px;
}

.sidebar-link{
display:flex;
align-items:center;
gap:12px;
padding:13px 16px;
margin-bottom:8px;
border-radius:12px;
text-decoration:none;
color:#374151;
font-weight:500;
transition:.2s;
border:none;
background:none;
width:100%;
}

.sidebar-link i{
font-size:20px;
}

.sidebar-link:hover{
background:#eef4ff;
color:#0d6efd;
}

.sidebar-link.active{
background:#0d6efd;
color:#fff;
}

/* =========================================
BODY
========================================= */

.body-wrapper{
flex:1;
margin-left:260px;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* =========================================
HEADER
========================================= */

.app-header{
background:#fff;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:1030;
}

.navbar-custom{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 18px;
}

/* =========================================
CONTENT
========================================= */

.main-content{
padding:25px;
flex:1;
}

/* =========================================
CARDS
========================================= */

.card-box{
background:#fff;
border:none;
border-radius:18px;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

/* =========================================
BUTTONS
========================================= */

.btn{
border-radius:10px;
}

/* =========================================
TABLES
========================================= */

.table{
margin-bottom:0;
}

.table th{
font-weight:600;
white-space:nowrap;
}

.table td,
.table th{
vertical-align:middle;
}

/* =========================================
OVERLAY MOBILE
========================================= */

.sidebar-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:1035;
opacity:0;
visibility:hidden;
transition:.3s;
}

.sidebar-overlay.show{
opacity:1;
visibility:visible;
}

/* =========================================
MOBILE
========================================= */

@media(max-width:991px){

.left-sidebar{
left:-280px;
width:260px;
}

.left-sidebar.show{
left:0;
}

.body-wrapper{
margin-left:0;
width:100%;
}

.main-content{
padding:18px;
}

}

/* =========================================
SMALL MOBILE
========================================= */

@media(max-width:576px){

.main-content{
padding:15px;
}

.brand-logo img{
max-width:135px;
}

.sidebar-link{
padding:12px;
font-size:14px;
}

}

</style>

</head>

<body>

<div class="page-wrapper">

<!-- ======================================
SIDEBAR
====================================== -->

<aside
class="left-sidebar"
id="sidebar">

<div class="brand-logo">

<img
src="/assets/images/logos/prestapp-remove.png"
alt="PrestApp">

</div>

<nav class="sidebar-nav">

<a
href="/html/admin/dashboard.html"
class="sidebar-link active">

<i class="ti ti-layout-dashboard"></i>
<span>Dashboard</span>

</a>

<a
href="/html/admin/clientes.html"
class="sidebar-link">

<i class="ti ti-users"></i>
<span>Clientes</span>

</a>

<a
href="/html/admin/prestamos.html"
class="sidebar-link">

<i class="ti ti-cash"></i>
<span>Préstamos</span>

</a>

<a
href="/html/admin/pagos.html"
class="sidebar-link">

<i class="ti ti-credit-card"></i>
<span>Pagos</span>

</a>

<a
href="/html/admin/trabajadores.html"
class="sidebar-link">

<i class="ti ti-user"></i>
<span>Trabajadores</span>

</a>

<button
type="button"
id="btnLogout"
class="sidebar-link text-danger"
title="Cerrar sesión"
aria-label="Cerrar sesión">

<i class="ti ti-logout"></i>
<span>Cerrar sesión</span>

</button>

</nav>

</aside>

<!-- ======================================
OVERLAY
====================================== -->

<div
class="sidebar-overlay"
id="sidebarOverlay">
</div>

<!-- ======================================
BODY
====================================== -->

<div class="body-wrapper">

<!-- HEADER -->

<header class="app-header">

<div class="navbar-custom">

<button
type="button"
class="btn btn-light d-lg-none"
id="btnMenu"
title="Abrir menú"
aria-label="Abrir menú">

<i class="ti ti-menu-2"></i>

</button>

<div class="ms-auto d-flex align-items-center gap-3">

<button
type="button"
class="btn btn-light"
title="Notificaciones"
aria-label="Notificaciones">

<i class="ti ti-bell"></i>

</button>

<img
src="/assets/images/profile/user-1.jpg"
alt="Usuario"
width="38"
height="38"
class="rounded-circle">

</div>

</div>

</header>

<!-- MAIN -->

<main class="main-content">

<!-- CONTENIDO -->

<div class="card card-box p-4">

<h2 class="fw-bold mb-2">
Plantilla Base
</h2>

<p class="text-muted mb-0">
Sistema base PrestApp listo para usar.
</p>

</div>

</main>

</div>

</div>

<!-- ======================================
JS
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* =========================================
MENU MOBILE
========================================= */

const btnMenu =
document.getElementById("btnMenu");

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("sidebarOverlay");

btnMenu?.addEventListener("click",()=>{

sidebar.classList.toggle("show");
overlay.classList.toggle("show");

});

overlay?.addEventListener("click",()=>{

sidebar.classList.remove("show");
overlay.classList.remove("show");

});

/* =========================================
LOGOUT
========================================= */

document.getElementById("btnLogout")
?.addEventListener("click",()=>{

localStorage.removeItem("token");
sessionStorage.clear();

location.href="/login";

});

</script>

</body>
</html>
