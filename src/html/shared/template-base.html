<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrestApp - Plantilla Base</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="/assets/images/logos/favicon.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/styles.min.css" />
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css" />

  <!-- NUEVO CSS (sin estilos inline) -->
  <link rel="stylesheet" href="/assets/css/template.css">
</head>

<body>

<div class="app-container">

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="sidebar">

    <div class="sidebar-content">

      <!-- Logo -->
      <div class="brand-logo text-center">
        <a href="index.html" title="Ir al dashboard">
          <img src="/assets/images/logos/prestapp-remove.png" alt="PrestApp Logo" width="150">
        </a>
      </div>

      <!-- Navegación -->
      <nav class="nav flex-column" id="sidebarNav">

        <span class="nav-title">INICIO</span>

        <a href="index.html" class="nav-link nav-link-sidebar">
          <i class="ti ti-layout-dashboard"></i>
          <span>Dashboard</span>
        </a>

        <span class="nav-title">GESTIÓN</span>

        <a href="trabajadores.html" class="nav-link nav-link-sidebar">
          <i class="ti ti-users"></i>
          <span>Trabajadores</span>
        </a>

        <a href="clientes.html" class="nav-link nav-link-sidebar">
          <i class="ti ti-user-check"></i>
          <span>Clientes</span>
        </a>

        <span class="nav-title">CUENTA</span>

        <button class="nav-link nav-link-sidebar btn-logout"
                id="btnCerrarSesion"
                title="Cerrar sesión">
          <i class="ti ti-logout"></i>
          <span>Cerrar sesión</span>
        </button>

      </nav>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="app-main">

    <!-- HEADER -->
    <header class="app-header">

      <div class="header-left">
        <button id="toggleSidebar"
                class="btn btn-light d-md-none"
                title="Abrir menú">
          <i class="ti ti-menu-2"></i>
        </button>
      </div>

      <div class="header-right">

        <!-- Notificaciones -->
        <div class="dropdown">
          <button class="btn btn-link position-relative"
                  data-bs-toggle="dropdown"
                  title="Notificaciones">
            <i class="ti ti-bell-ringing"></i>
            <span class="badge-dot"></span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Notificación 1</a></li>
            <li><a class="dropdown-item" href="#">Notificación 2</a></li>
          </ul>
        </div>

        <!-- Usuario -->
        <div class="dropdown">
          <button class="btn p-0"
                  data-bs-toggle="dropdown"
                  title="Menú de usuario">
            <img src="/assets/images/profile/user-1.jpg"
                 alt="Usuario"
                 class="avatar">
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="#">
                <i class="ti ti-user"></i> Mi perfil
              </a>
            </li>
            <li><hr></li>
            <li>
              <button class="dropdown-item"
                      id="btnCerrarSesionHeader"
                      title="Cerrar sesión">
                <i class="ti ti-logout"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </div>

      </div>

    </header>

    <!-- CONTENIDO -->
    <main class="app-content" id="appContent">
      <!-- Aquí va el contenido dinámico -->
    </main>

  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* Activar link activo */
document.querySelectorAll('.nav-link-sidebar').forEach(link => {
  if (link.href.includes(window.location.pathname)) {
    link.classList.add('active');
  }
});

/* Sidebar móvil */
const toggle = document.getElementById('toggleSidebar');
const sidebar = document.getElementById('sidebar');

if (toggle) {
  toggle.addEventListener('click', () => {
    sidebar.classList.toggle('show');
  });
}

/* Cerrar sesión */
document.querySelectorAll('#btnCerrarSesion, #btnCerrarSesionHeader')
.forEach(btn => {
  btn.addEventListener('click', () => {
    if (confirm('¿Cerrar sesión?')) {
      window.location.href = '/logout';
    }
  });
});
</script>

</body>
</html>
