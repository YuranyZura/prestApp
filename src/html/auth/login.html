<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrestApp | Iniciar Sesión</title>

<link rel="stylesheet" href="/assets/css/styles.min.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d6efd,#0dcaf0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    width:100%;
    max-width:430px;
    padding:40px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:170px;
}

h1{
    text-align:center;
    font-size:30px;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-control{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

.form-control:focus{
    outline:none;
    border-color:#0d6efd;
}

.btn-login{
    width:100%;
    border:none;
    background:#0d6efd;
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.btn-login:hover{
    background:#0b5ed7;
}

.extra{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:14px;
}

.extra a{
    text-decoration:none;
    color:#0d6efd;
}

.msg{
    text-align:center;
    margin-bottom:15px;
    font-size:14px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.footer{
    margin-top:20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<img src="/assets/images/logos/prestapp-remove.png">
</div>

<h1>Bienvenido</h1>
<p>Ingresa para continuar</p>

<div id="mensaje" class="msg"></div>

<form id="formLogin">

<input
type="email"
id="correo"
class="form-control"
placeholder="Correo electrónico"
autocomplete="off"
required>

<input
type="password"
id="contrasena"
class="form-control"
placeholder="Contraseña"
required>

<label style="font-size:14px;">
<input type="checkbox" id="recordarme">
Recordarme
</label>

<br><br>

<button type="submit" class="btn-login">
<i class="ti ti-login"></i>
Iniciar sesión
</button>

</form>

<div class="extra">
<a href="register.html">Crear cuenta</a>
<a href="#">¿Olvidaste contraseña?</a>
</div>

<div class="footer">
© 2026 PrestApp
</div>

</div>

<script type="module">

import { API_URL } from "/js/config.js";

const form = document.getElementById("formLogin");
const msg = document.getElementById("mensaje");

function mostrar(texto,tipo="error"){
    msg.className = "msg " + tipo;
    msg.innerText = texto;
}

form.addEventListener("submit", async(e)=>{

    e.preventDefault();

    const correo = document.getElementById("correo").value.trim();
    const contrasena = document.getElementById("contrasena").value.trim();

    if(!correo || !contrasena){
        mostrar("Complete todos los campos");
        return;
    }

    try{

        const res = await fetch(`${API_URL}/auth/login`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                correo,
                contrasena
            })
        });

        const data = await res.json();

        if(data.success){

            mostrar("Acceso correcto","success");

            localStorage.setItem("token", data.token);
            localStorage.setItem("usuario", JSON.stringify(data.user));

            setTimeout(()=>{

                if(data.user.rol === "super_admin"){
                    location.href="/html/admin/administradores.html";
                }
                else if(data.user.rol === "administrador"){
                    location.href="/html/admin/dashboard.html";
                }
                else{
                    location.href="/html/trabajador/Rol2_trabajador.html";
                }

            },1000);

        }else{
            mostrar(data.message || "Credenciales inválidas");
        }

    }catch(error){
        console.log(error);
        mostrar("No se pudo conectar con el servidor");
    }

});

</script>

</body>
</html>
