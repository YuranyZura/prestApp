<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrestApp | Iniciar Sesión</title>

<link rel="stylesheet" href="/assets/css/styles.min.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d6efd,#0dcaf0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    width:100%;
    max-width:420px;
    padding:40px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:160px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:10px;
    color:#111;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-control{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

.form-control:focus{
    outline:none;
    border-color:#0d6efd;
}

.btn-login{
    width:100%;
    border:none;
    background:#0d6efd;
    color:#fff;
    padding:12px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn-login:hover{
    background:#0b5ed7;
}

.extra{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:14px;
}

.extra a{
    text-decoration:none;
    color:#0d6efd;
}

.footer{
    margin-top:20px;
    text-align:center;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img src="/assets/images/logos/prestapp-remove.png" alt="PrestApp">
    </div>

    <h1>Bienvenido</h1>
    <p>Ingresa para continuar</p>

    <form id="formLogin">

        <input 
            type="email"
            id="correo"
            class="form-control"
            placeholder="Correo electrónico"
            required>

        <input 
            type="password"
            id="contrasena"
            class="form-control"
            placeholder="Contraseña"
            required>

        <label style="font-size:14px;">
            <input type="checkbox" id="recordarme">
            Recordarme
        </label>

        <br><br>

        <button type="submit" class="btn-login">
            <i class="ti ti-login"></i>
            Iniciar sesión
        </button>

    </form>

    <div class="extra">
        <a href="register.html">Crear cuenta</a>
        <a href="#">¿Olvidaste contraseña?</a>
    </div>

    <div class="footer">
        © 2025 PrestApp
    </div>

</div>

<script type="module" src="/js/login.js"></script>

</body>
</html>
