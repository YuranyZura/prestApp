<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrestApp - Iniciar Sesión</title>

  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <div class="page-wrapper" id="main-wrapper">
    <div class="login-container">
      
      <div class="login-card card">
        <div class="card-body">

          <!-- Logo -->
          <a href="#" class="logo-container" title="Ir al inicio">
            <img src="../assets/images/logos/prestapp-remove.png" alt="Logo PrestApp" width="180">
          </a>

          <p class="text-center text-muted">Tu préstamo seguro</p>

          <!-- Formulario -->
          <form id="formLogin">

            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" 
                     name="correo" 
                     id="correo"
                     class="form-control" 
                     placeholder="ejemplo@correo.com"
                     required>
            </div>

            <div class="mb-4">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input type="password" 
                     name="contrasena" 
                     id="contrasena"
                     class="form-control"
                     placeholder="••••••••"
                     required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="recordar">
                <label class="form-check-label" for="recordar">
                  Recordar dispositivo
                </label>
              </div>

              <a class="text-primary fw-bold" href="#" title="Recuperar contraseña">
                ¿Olvidaste tu contraseña?
              </a>
            </div>

            <button type="submit" 
                    class="btn btn-primary w-100 mb-4"
                    title="Iniciar sesión">
              Iniciar sesión
            </button>

            <div class="text-center">
              <p class="fw-bold mb-0">¿Nuevo en PrestApp?</p>
              <a class="text-primary fw-bold" href="#" title="Crear cuenta">
                Crear cuenta
              </a>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal Confirmación -->
  <div class="modal fade" id="modalConfirmarReenvio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-body">
          <p>
            Tu cuenta no está verificada.<br>
            ¿Reenviar código a <strong id="correoConfirmacion"></strong>?
          </p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" title="Cancelar">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary" id="btnConfirmarReenvio" title="Reenviar código">
            Reenviar código
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal Verificación -->
  <div class="modal fade" id="modalVerificacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Verifica tu correo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" title="Cerrar"></button>
        </div>

        <div class="modal-body text-center">
          <p>Ingresa el código enviado a tu correo:</p>

          <form id="formVerificacion">

            <div class="codigo-container">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4" title="Verificar código">
              Verificar
            </button>

          </form>

          <p class="mt-3">
            ¿No recibiste el código?
            <button id="btnReenviar" class="btn btn-link" title="Reenviar código">
              Reenviar
            </button>
          </p>

        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="toastLoginExito" class="toast">
      <div class="toast-header bg-success text-white">
        <strong class="me-auto">Éxito</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" title="Cerrar"></button>
      </div>
      <div class="toast-body">
        Inicio de sesión exitoso
      </div>
    </div>

    <div id="toastLoginError" class="toast">
      <div class="toast-header bg-danger text-white">
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" title="Cerrar"></button>
      </div>
      <div class="toast-body" id="toastLoginErrorBody"></div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/login.js"></script>

</body>
</html>
