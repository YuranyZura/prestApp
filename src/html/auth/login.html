<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
name="description"
content="Iniciar sesión en PrestApp"
>

<title>PrestApp | Iniciar Sesión</title>

<link
rel="shortcut icon"
href="/assets/images/logos/favicon.png"
>

<link
rel="stylesheet"
href="/assets/css/styles.min.css"
>

<link
rel="stylesheet"
href="/assets/css/icons/tabler-icons/tabler-icons.css"
>

<style>

:root{
--primary:#0d6efd;
--primary-dark:#0b5ed7;
--bg:#f5f7fa;
--text:#1f2937;
--muted:#6b7280;
--border:#d1d5db;
}

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
font-family:Arial, Helvetica, sans-serif;
background:
linear-gradient(
135deg,
#0d6efd,
#0dcaf0
);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
}

.login-box{
width:100%;
max-width:430px;
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:
0 15px 40px rgba(0,0,0,.15);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo-img{
max-width:170px;
width:100%;
height:auto;
}

h1{
text-align:center;
font-size:30px;
margin-bottom:10px;
color:var(--text);
}

.login-text{
text-align:center;
color:var(--muted);
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

.form-label{
display:block;
margin-bottom:8px;
font-weight:600;
color:var(--text);
}

.form-control{
width:100%;
padding:13px 15px;
border:1px solid var(--border);
border-radius:12px;
font-size:15px;
transition:.2s;
}

.form-control:focus{
outline:none;
border-color:var(--primary);
box-shadow:
0 0 0 3px rgba(13,110,253,.15);
}

.password-box{
position:relative;
}

.toggle-password{
position:absolute;
top:50%;
right:12px;
transform:translateY(-50%);
border:none;
background:none;
cursor:pointer;
font-size:20px;
color:#666;
}

.form-check{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.btn-login{
width:100%;
border:none;
background:var(--primary);
color:#fff;
padding:14px;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

.btn-login:hover{
background:var(--primary-dark);
}

.btn-login:disabled{
opacity:.7;
cursor:not-allowed;
}

.extra{
display:flex;
justify-content:space-between;
gap:15px;
margin-top:18px;
font-size:14px;
flex-wrap:wrap;
}

.extra a{
text-decoration:none;
color:var(--primary);
font-weight:500;
}

.msg{
text-align:center;
margin-bottom:15px;
font-size:14px;
font-weight:600;
}

.success{
color:#198754;
}

.error{
color:#dc3545;
}

.footer{
margin-top:25px;
text-align:center;
font-size:14px;
color:#666;
}

@media(max-width:576px){

body{
padding:15px;
}

.login-box{
padding:25px;
border-radius:16px;
}

h1{
font-size:26px;
}

.extra{
flex-direction:column;
align-items:center;
}

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<img
src="/assets/images/logos/prestapp-remove.png"
alt="Logo PrestApp"
class="logo-img"
loading="lazy"
>

</div>

<h1>
Bienvenido
</h1>

<p class="login-text">
Ingresa para continuar
</p>

<div
id="mensaje"
class="msg"
aria-live="polite"
></div>

<form id="formLogin">

<div class="form-group">

<label
for="correo"
class="form-label"
>
Correo electrónico
</label>

<input
type="email"
id="correo"
name="correo"
class="form-control"
placeholder="correo@empresa.com"
autocomplete="email"
required
title="Ingrese su correo electrónico"
aria-label="Correo electrónico"
>

</div>

<div class="form-group">

<label
for="contrasena"
class="form-label"
>
Contraseña
</label>

<div class="password-box">

<input
type="password"
id="contrasena"
name="contrasena"
class="form-control"
placeholder="Ingrese su contraseña"
autocomplete="current-password"
required
title="Ingrese su contraseña"
aria-label="Contraseña"
>

<button
type="button"
class="toggle-password"
id="togglePassword"
title="Mostrar contraseña"
aria-label="Mostrar contraseña"
>

<i class="ti ti-eye"></i>

</button>

</div>

</div>

<div class="form-check">

<input
type="checkbox"
id="recordarme"
class="form-check-input"
>

<label
for="recordarme"
class="form-check-label"
>
Recordarme
</label>

</div>

<button
type="submit"
class="btn-login"
id="btnLogin"
>

<i class="ti ti-login"></i>
Iniciar sesión

</button>

</form>

<div class="extra">

<a href="register.html">
Crear cuenta
</a>

<a href="#">
¿Olvidaste contraseña?
</a>

</div>

<div class="footer">
© 2026 PrestApp
</div>

</div>

<script type="module">

import { API_URL }
from "/js/config.js";

const form =
document.getElementById("formLogin");

const msg =
document.getElementById("mensaje");

const btnLogin =
document.getElementById("btnLogin");

const togglePassword =
document.getElementById("togglePassword");

const inputPassword =
document.getElementById("contrasena");

/* =========================
MOSTRAR MENSAJE
========================= */
function mostrar(
texto,
tipo="error"
){

msg.className =
`msg ${tipo}`;

msg.textContent =
texto;

}

/* =========================
MOSTRAR PASSWORD
========================= */
togglePassword
.addEventListener("click",()=>{

const visible =
inputPassword.type === "text";

inputPassword.type =
visible
? "password"
: "text";

togglePassword.innerHTML =
visible
? '<i class="ti ti-eye"></i>'
: '<i class="ti ti-eye-off"></i>';

});

/* =========================
LOGIN
========================= */
form.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

btnLogin.disabled = true;

const correo =
document.getElementById("correo")
.value
.trim();

const contrasena =
inputPassword.value.trim();

if(!correo || !contrasena){

mostrar(
"Complete todos los campos"
);

btnLogin.disabled = false;

return;

}

try{

const res =
await fetch(
`${API_URL}/auth/login`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
correo,
contrasena
})
}
);

const data =
await res.json();

if(data.success){

mostrar(
"Acceso correcto",
"success"
);

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"usuario",
JSON.stringify(data.user)
);

setTimeout(()=>{

if(
data.user.rol ===
"super_admin"
){

location.href =
"/html/admin/administradores.html";

}

else if(
data.user.rol ===
"administrador"
){

location.href =
"/html/admin/dashboard.html";

}

else{

location.href =
"/html/trabajador/Rol2_trabajador.html";

}

},1000);

}else{

mostrar(
data.message ||
"Credenciales inválidas"
);

}

}catch(error){

console.error(error);

mostrar(
"No se pudo conectar con el servidor"
);

}

btnLogin.disabled = false;

});

</script>

</body>
</html>
