<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
name="description"
content="Iniciar sesión en PrestApp"
>

<title>PrestApp | Iniciar Sesión</title>

<link
rel="shortcut icon"
href="/assets/images/logos/favicon.png"
>

<link
rel="stylesheet"
href="/assets/css/styles.css"
>

<link
rel="stylesheet"
href="/assets/css/icons/tabler-icons/tabler-icons.css"
>

</head>

<body>

<div class="login-box">

<div class="logo">

<img
src="/assets/images/logos/prestapp-remove.png"
alt="Logo PrestApp"
class="logo-img"
loading="lazy"
>

</div>

<h1>
Bienvenido
</h1>

<p class="login-text">
Ingresa para continuar
</p>

<div
id="mensaje"
class="msg"
aria-live="polite"
></div>

<form id="formLogin"
autocomplete="on"
onsubmit="return false;">

<div class="form-group">

<label
for="correo"
class="form-label"
>
Correo electrónico
</label>

<input
type="email"
id="correo"
name="correo"
class="form-control"
placeholder="correo@empresa.com"
autocomplete="email"
required
title="Ingrese su correo electrónico"
aria-label="Correo electrónico"
>

</div>

<div class="form-group">

<label
for="contrasena"
class="form-label"
>
Contraseña
</label>

<div class="password-box">

<input
type="password"
id="contrasena"
name="contrasena"
class="form-control"
placeholder="Ingrese su contraseña"
autocomplete="current-password"
required
title="Ingrese su contraseña"
aria-label="Contraseña"
>

<button
type="button"
class="toggle-password"
id="togglePassword"
title="Mostrar contraseña"
aria-label="Mostrar contraseña"
>

<i class="ti ti-eye"></i>

</button>

</div>

</div>

<div class="form-check">

<input
type="checkbox"
id="recordarme"
class="form-check-input"
>

<label
for="recordarme"
class="form-check-label"
>
Recordarme
</label>

</div>

<button
type="button"
class="btn-login"
id="btnLogin"
>

<i class="ti ti-login"></i>
Iniciar sesión

</button>

</form>

<div class="extra">

<a href="register.html">
Crear cuenta
</a>

<a href="#">
¿Olvidaste contraseña?
</a>

</div>

<div class="footer">
© 2026 PrestApp
</div>

</div>

<script
type="module"
src="/assets/js/auth.js">
</script>

</body>
</html>
