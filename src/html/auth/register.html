<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrestApp | Crear Cuenta</title>

<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css"

</head>

<body>

<div class="register-box">

    <div class="logo">
        <img src="/assets/images/logos/prestapp-remove.png" alt="PrestApp">
    </div>

    <h1>Crear Cuenta</h1>
    <p>Regístrate para comenzar</p>

  <form id="formRegister">

    <div class="row">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
        <input type="text" class="form-control" id="apellido" placeholder="Apellido" required>
    </div>

    <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" autocomplete="email" required>

    <div class="row">
        <input type="tel" class="form-control" id="telefono" placeholder="Teléfono" required>
        <input type="text" class="form-control" id="cedula" placeholder="Cédula" required>
    </div>

    <div class="row">
        <input type="password" class="form-control" id="password" placeholder="Contraseña" autocomplete="new-password" required>
        <input type="password" class="form-control" id="confirmar" placeholder="Confirmar contraseña" autocomplete="new-password" required>
    </div>

    <label for="rol" class="form-label">
    Rol de usuario
</label>

<select
    class="form-control"
    id="rol"
    name="rol"
    required
    title="Selecciona el rol del usuario"
    aria-label="Selecciona el rol del usuario">

    <option value="" disabled selected>
        Selecciona rol
    </option>

    <option value="trabajador">
        Trabajador
    </option>

    <option value="administrador">
        Administrador
    </option>

</select>

    <button type="submit" class="btn-register">
        <i class="ti ti-user-plus"></i>
        Registrarme
    </button>

</form>  

    <div class="footer">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
    </div>

</div>

<script 
type="module"
src="/assets/js/auth.js">


const form = document.getElementById("formRegister");

form.addEventListener("submit", async (e) => {
e.preventDefault();

// Obtener valores de los campos
const nombre = document.getElementById("nombre").value.trim();
const apellido = document.getElementById("apellido").value.trim();
const correo = document.getElementById("correo").value.trim();
const telefono = document.getElementById("telefono").value.trim();
const cedula = document.getElementById("cedula").value.trim();
const password = document.getElementById("password").value.trim();
const confirmar = document.getElementById("confirmar").value.trim();
const rol = document.getElementById("rol").value;

// Validaciones
  if (!nombre || !apellido || !correo || !telefono || !cedula || !password || !confirmar || !rol) {
    alert("Todos los campos son obligatorios");
    return;
  }

  if (password.length < 6) {
    alert("La contraseña debe tener al menos 6 caracteres");
    return;
  }

if(password !== confirmar){
   alert("Las contraseñas no coinciden");
   return;
}

try{

const res = await fetch(`${API_URL}/auth/register`,{
   method:"POST",
   headers:{
      "Content-Type":"application/json"
   },
   body: JSON.stringify({
      nombre,
      apellido,
      correo,
      telefono,
      cedula,
      contrasena: password,
      rol
   })
});

// ⚠️ IMPORTANTE: validar respuesta HTTP
    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "Error en la respuesta del servidor");
    }

const data = await res.json();

if(data.success){
   alert("Registro exitoso");
   window.location.href="login.html";
}else{
   alert(data.message || "No se pudo registrar");
}

}catch(error){
    console.error("Error:", error);
   alert("Error del servidor o conexión");
}

});
</script>
