<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrestApp - Registro</title>

  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <div class="page-wrapper" id="main-wrapper">
    <div class="login-container">

      <div class="login-card card">
        <div class="card-body">

          <!-- Logo -->
          <a href="login.html" class="logo-container" title="Ir a iniciar sesión">
            <img src="../assets/images/logos/prestapp-remove.png" width="180" alt="Logo PrestApp">
          </a>

          <p class="text-center text-muted">Crea tu cuenta en PrestApp</p>

          <!-- Formulario -->
          <form id="formRegister">

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text"
                     id="nombre"
                     name="nombre"
                     class="form-control"
                     placeholder="Ej: Juan"
                     required>
            </div>

            <div class="mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text"
                     id="apellido"
                     name="apellido"
                     class="form-control"
                     placeholder="Ej: Pérez"
                     required>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email"
                     id="correo"
                     name="correo"
                     class="form-control"
                     placeholder="ejemplo@correo.com"
                     required>
            </div>

            <div class="mb-4">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input type="password"
                     id="contrasena"
                     name="contrasena"
                     class="form-control"
                     placeholder="Mínimo 8 caracteres"
                     minlength="8"
                     required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 mb-4"
                    title="Registrarse">
              Registrarse
            </button>

            <div class="text-center">
              <p class="fw-bold mb-0">¿Ya tienes una cuenta?</p>
              <a href="login.html" class="text-primary fw-bold" title="Ir a iniciar sesión">
                Iniciar sesión
              </a>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal Verificación -->
  <div class="modal fade" id="modalVerificacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Verifica tu correo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" title="Cerrar"></button>
        </div>

        <div class="modal-body text-center">
          <p>Ingresa el código enviado a tu correo:</p>

          <form id="formVerificacion">

            <div class="codigo-container">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
              <input type="text" maxlength="1" class="codigo-input">
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 mt-4"
                    title="Verificar código">
              Verificar
            </button>

          </form>

          <p class="mt-3">
            ¿No recibiste el código?
            <button id="btnReenviar"
                    class="btn btn-link"
                    title="Reenviar código">
              Reenviar
            </button>
          </p>

        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="toastVerificacion" class="toast">
      <div class="toast-header bg-success text-white">
        <strong class="me-auto">Correo verificado</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" title="Cerrar"></button>
      </div>
      <div class="toast-body">
        Redirigiendo al login...
      </div>
    </div>

    <div id="toastError" class="toast">
      <div class="toast-header bg-danger text-white">
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" title="Cerrar"></button>
      </div>
      <div class="toast-body" id="toastErrorBody"></div>
    </div>

    <div id="toastReenvio" class="toast">
      <div class="toast-header bg-info text-white">
        <strong class="me-auto">Código reenviado</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" title="Cerrar"></button>
      </div>
      <div class="toast-body">
        Se envió un nuevo código a tu correo.
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/register.js"></script>

</body>

</html>
