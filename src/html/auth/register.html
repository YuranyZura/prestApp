<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrestApp | Crear Cuenta</title>

<link rel="stylesheet" href="/assets/css/styles.min.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d6efd,#0dcaf0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    background:#fff;
    width:100%;
    max-width:480px;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:170px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:10px;
    color:#111;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-control{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

.form-control:focus{
    outline:none;
    border-color:#0d6efd;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.btn-register{
    width:100%;
    border:none;
    background:#0d6efd;
    color:#fff;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn-register:hover{
    background:#0b5ed7;
}

.footer{
    margin-top:18px;
    text-align:center;
    font-size:14px;
}

.footer a{
    color:#0d6efd;
    text-decoration:none;
}

@media(max-width:600px){
    .row{
        grid-template-columns:1fr;
    }

    .register-box{
        margin:20px;
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">
        <img src="/assets/images/logos/prestapp-remove.png" alt="PrestApp">
    </div>

    <h1>Crear Cuenta</h1>
    <p>Regístrate para comenzar</p>

  <form id="formRegister">

    <div class="row">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
        <input type="text" class="form-control" id="apellido" placeholder="Apellido" required>
    </div>

    <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" autocomplete="email" required>

    <div class="row">
        <input type="tel" class="form-control" id="telefono" placeholder="Teléfono" required>
        <input type="text" class="form-control" id="cedula" placeholder="Cédula" required>
    </div>

    <div class="row">
        <input type="password" class="form-control" id="password" placeholder="Contraseña" autocomplete="new-password" required>
        <input type="password" class="form-control" id="confirmar" placeholder="Confirmar contraseña" autocomplete="new-password" required>
    </div>

    <label for="rol" class="form-label">
    Rol de usuario
</label>

<select
    class="form-control"
    id="rol"
    name="rol"
    required
    title="Selecciona el rol del usuario"
    aria-label="Selecciona el rol del usuario">

    <option value="" disabled selected>
        Selecciona rol
    </option>

    <option value="trabajador">
        Trabajador
    </option>

    <option value="administrador">
        Administrador
    </option>

</select>

    <button type="submit" class="btn-register">
        <i class="ti ti-user-plus"></i>
        Registrarme
    </button>

</form>  

    <div class="footer">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
    </div>

</div>

<script type="module">
import { API_URL } from "/assets/js/config.js";

const form = document.getElementById("formRegister");

form.addEventListener("submit", async (e) => {
e.preventDefault();

// Obtener valores de los campos
const nombre = document.getElementById("nombre").value.trim();
const apellido = document.getElementById("apellido").value.trim();
const correo = document.getElementById("correo").value.trim();
const telefono = document.getElementById("telefono").value.trim();
const cedula = document.getElementById("cedula").value.trim();
const password = document.getElementById("password").value.trim();
const confirmar = document.getElementById("confirmar").value.trim();
const rol = document.getElementById("rol").value;

// Validaciones
  if (!nombre || !apellido || !correo || !telefono || !cedula || !password || !confirmar || !rol) {
    alert("Todos los campos son obligatorios");
    return;
  }

  if (password.length < 6) {
    alert("La contraseña debe tener al menos 6 caracteres");
    return;
  }

if(password !== confirmar){
   alert("Las contraseñas no coinciden");
   return;
}

try{

const res = await fetch(`${API_URL}/auth/register`,{
   method:"POST",
   headers:{
      "Content-Type":"application/json"
   },
   body: JSON.stringify({
      nombre,
      apellido,
      correo,
      telefono,
      cedula,
      contrasena: password,
      rol
   })
});

// ⚠️ IMPORTANTE: validar respuesta HTTP
    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "Error en la respuesta del servidor");
    }

const data = await res.json();

if(data.success){
   alert("Registro exitoso");
   window.location.href="login.html";
}else{
   alert(data.message || "No se pudo registrar");
}

}catch(error){
    console.error("Error:", error);
   alert("Error del servidor o conexión");
}

});
</script>
