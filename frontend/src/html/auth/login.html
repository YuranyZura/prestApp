<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrestApp | Login</title>

<link rel="stylesheet" href="/assets/css/pages/login.css">

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0d6efd,#00c6ff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#fff;
    width:400px;
    padding:40px;
    border-radius:20px;
}

.form-control{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

.btn-login{
    width:100%;
    padding:14px;
    border:none;
    background:#0d6efd;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.msg{
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.msg.error{
    background:#ffdede;
    color:#c40000;
    display:block;
}

.msg.success{
    background:#d8ffe1;
    color:#008a2e;
    display:block;
}

</style>

</head>

<body>

<div class="login-box">

    <h1>Bienvenido</h1>

    <div id="mensaje" class="msg"></div>

    <form id="formLogin" autocomplete="off">

    <input
        type="email"
        id="correo"
        name="correo"
        class="form-control"
        placeholder="Correo electrónico"
        autocomplete="new-password"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        required
    >

    <input
        type="password"
        id="contrasena"
        name="contrasena"
        class="form-control"
        placeholder="Contraseña"
        autocomplete="new-password"
        required
    >

    <button type="submit"
id="btnLogin"
class="btn-login">
        Iniciar sesión
    </button
    >

</form>

</div>

<script type="module" src="/assets/js/login.js"></script>

</body>
</html>
