<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Clientes | PrestApp
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="../../css/global.css"
  />

  <link
    rel="stylesheet"
    href="../../css/trabajador.css"
  />

</head>

<body>

  <!-- ===================================== -->
  <!-- SIDEBAR -->
  <!-- ===================================== -->

  <aside class="sidebar">

    <div class="logo">

      <img
        src="/icons/logo.png"
        alt="PrestApp"
      />

      <h2>
        PrestApp
      </h2>

    </div>

    <nav class="menu">

      <a
        href="./dashboard.html"
      >
        Dashboard
      </a>

      <a
        href="./clientes.html"
        class="active"
      >
        Clientes
      </a>

      <a
        href="./cobranzas.html"
      >
        Cobranzas
      </a>

      <a
        href="./mapa.html"
      >
        Mapa
      </a>

      <button
        id="btnLogout"
        class="logout-btn"
      >
        Cerrar sesión
      </button>

    </nav>

  </aside>

  <!-- ===================================== -->
  <!-- CONTENIDO -->
  <!-- ===================================== -->

  <main class="main-content">

    <!-- TOPBAR -->

    <header class="topbar">

      <div>

        <h1>
          Clientes
        </h1>

        <p>
          Gestión de clientes asignados
        </p>

      </div>

      <div class="usuario-info">

        <span id="nombreUsuario">
          Trabajador
        </span>

      </div>

    </header>

    <!-- BUSCADOR -->

    <section class="search-section">

      <input
        type="text"
        id="buscarCliente"
        placeholder="Buscar cliente..."
      />

    </section>

    <!-- TABLA -->

    <section class="table-section">

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>Nombre</th>

              <th>Teléfono</th>

              <th>Dirección</th>

              <th>Estado</th>

              <th>Acciones</th>

            </tr>

          </thead>

          <tbody id="tablaClientes">

            <!-- CLIENTES DINÁMICOS -->

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- ===================================== -->
  <!-- MODAL -->
  <!-- ===================================== -->

  <div
    class="modal hidden"
    id="modalCliente"
  >

    <div class="modal-content">

      <h2>
        Detalle Cliente
      </h2>

      <div id="detalleCliente">

      </div>

      <button
        id="cerrarModal"
      >
        Cerrar
      </button>

    </div>

  </div>

  <!-- ===================================== -->
  <!-- JS -->
  <!-- ===================================== -->

  <script
    type="module"
    src="../../js/trabajador/clientes.js"
  ></script>

</body>

</html>
