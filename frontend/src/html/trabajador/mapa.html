<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<!-- RESPONSIVE -->
<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
name="description"
content="PrestApp - Ruta del trabajador en tiempo real">

<meta
name="apple-mobile-web-app-status-bar-style"
content="default">

<meta
name="mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-capable"
content="yes">
<title>PrestApp | Mapa</title>

<!-- FAVICON -->
<link
rel="shortcut icon"
href="/assets/images/logos/favicon.png">

<!-- CSS -->
<link
rel="stylesheet"
href="/assets/css/styles.css">

<link
rel="stylesheet"
href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>

html,
body{
height:100%;
margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
background:#f5f7fa;
overflow:hidden;
}

/* APP */
.app{
display:flex;
flex-direction:column;
height:100vh;
}

/* HEADER */
.header-app{
background:#ffffff;
border-bottom:1px solid #e9ecef;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.user-box{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:44px;
height:44px;
border-radius:50%;
background:#0d6efd;
color:#fff;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
}

.user-name{
font-weight:700;
font-size:15px;
line-height:1.1;
}

.user-role{
font-size:13px;
color:#6c757d;
}

/* MAIN */
.main-content{
flex:1;
position:relative;
overflow:hidden;
}

/* MAPA */
#map{
width:100%;
height:100%;
}

/* PANEL INFO */
.info-panel{
position:absolute;
bottom:85px;
left:15px;
right:15px;
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 10px 25px rgba(0,0,0,.10);
z-index:1000;
display:none;
}

.info-panel.show{
display:block;
}

/* BOTTOM NAV */
.bottom-nav{
height:72px;
background:#fff;
border-top:1px solid #dee2e6;
display:flex;
justify-content:space-around;
align-items:center;
padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
border:none;
background:none;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:13px;
color:#6c757d;
width:100%;
height:100%;
cursor:pointer;
}

.nav-btn.active{
color:#0d6efd;
font-weight:700;
}

.nav-btn i{
font-size:22px;
margin-bottom:3px;
}

/* MOBILE */
@media(max-width:768px){

.header-app{
padding:10px 12px;
}

.avatar{
width:40px;
height:40px;
font-size:14px;
}

.info-panel{
bottom:80px;
left:10px;
right:10px;
}

}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->
<header class="header-app">

<div class="user-box">

<div
class="avatar"
aria-label="Usuario">
JD
</div>

<div>

<div
class="user-name"
id="nombreUsuario">
Juan Delgado
</div>

<div class="user-role">
Trabajador
</div>

</div>
</div>

<button
type="button"
class="btn btn-outline-primary btn-sm"
id="btnCerrarSesion"
title="Cerrar sesión"
aria-label="Cerrar sesión">

<i class="ti ti-logout"></i>

</button>

</header>

<!-- MAIN -->
<main class="main-content">

<!-- MAPA -->
<div
id="map"
role="region"
aria-label="Mapa de ubicación">
</div>

<!-- PANEL INFO -->
<div
class="info-panel"
id="infoPanel">

<h5 class="fw-bold mb-3">
<i class="ti ti-route"></i>
Información de ruta
</h5>

<div class="mb-2">
<small class="text-muted d-block">
Destino
</small>

<strong>
Cliente Principal
</strong>
</div>

<div class="mb-2">
<small class="text-muted d-block">
Tiempo estimado
</small>

<strong>
15 minutos
</strong>
</div>

<div>
<small class="text-muted d-block">
Estado
</small>

<strong class="text-success">
Activo
</strong>
</div>

</div>

</main>

<!-- NAV -->
<nav class="bottom-nav">

<button
type="button"
class="nav-btn active"
id="btnMapa"
title="Mapa"
aria-label="Ver mapa">

<i class="ti ti-map"></i>
<span>Mapa</span>

</button>

<button
type="button"
class="nav-btn"
id="btnInfo"
title="Información"
aria-label="Ver información">

<i class="ti ti-route"></i>
<span>Ruta</span>

</button>

</nav>

</div>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- GOOGLE MAPS -->
<script
src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&callback=initMap"
async
defer>
</script>

<script>

/* =========================================
CONFIG
========================================= */

let map;
let marker;

/* =========================================
INICIAR MAPA
========================================= */

function initMap(){

const ubicacion = {
lat:18.4861,
lng:-69.9312
};

map = new google.maps.Map(
document.getElementById("map"),
{
center:ubicacion,
zoom:14
}
);

marker = new google.maps.Marker({
position:ubicacion,
map:map,
title:"Mi ubicación"
});

/* GEOLOCALIZACION */

if(navigator.geolocation){

navigator.geolocation.watchPosition(

pos=>{

const nueva = {
lat:pos.coords.latitude,
lng:pos.coords.longitude
};

marker.setPosition(nueva);
map.setCenter(nueva);

},

error=>{
console.log(error);
},

{
enableHighAccuracy:true,
maximumAge:0,
timeout:5000
}

);

}

}

/* =========================================
NAV MOBILE
========================================= */

const btnMapa =
document.getElementById("btnMapa");

const btnInfo =
document.getElementById("btnInfo");

const panel =
document.getElementById("infoPanel");

/* MAPA */
btnMapa.addEventListener("click",()=>{

btnMapa.classList.add("active");
btnInfo.classList.remove("active");

panel.classList.remove("show");

});

/* INFO */
btnInfo.addEventListener("click",()=>{

btnInfo.classList.add("active");
btnMapa.classList.remove("active");

panel.classList.toggle("show");

});

/* =========================================
LOGOUT
========================================= */

document
.getElementById("btnCerrarSesion")
.addEventListener("click",()=>{

if(confirm("¿Cerrar sesión?")){

localStorage.removeItem("token");

location.href="/html/auth/login.html";

}

});

</script>

</body>
</html>
