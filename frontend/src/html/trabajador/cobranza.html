<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Cobranzas | PrestApp
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../../css/global.css"
  />

  <link
    rel="stylesheet"
    href="../../css/trabajador.css"
  />

</head>

<body>

  <!-- ===================================== -->
  <!-- SIDEBAR -->
  <!-- ===================================== -->

  <aside class="sidebar">

    <div class="logo">

      <img
        src="/icons/logo.png"
        alt="PrestApp"
      />

      <h2>
        PrestApp
      </h2>

    </div>

    <nav class="menu">

      <a
        href="./dashboard.html"
      >
        Dashboard
      </a>

      <a
        href="./clientes.html"
      >
        Clientes
      </a>

      <a
        href="./cobranza.html"
        class="active"
      >
        Cobranzas
      </a>

      <a
        href="./mapa.html"
      >
        Mapa
      </a>

      <button
        id="btnLogout"
        class="logout-btn"
      >
        Cerrar sesión
      </button>

    </nav>

  </aside>

  <!-- ===================================== -->
  <!-- CONTENIDO -->
  <!-- ===================================== -->

  <main class="main-content">

    <!-- TOPBAR -->

    <header class="topbar">

      <div>

        <h1>
          Cobranzas
        </h1>

        <p>
          Gestión de pagos y cobranzas
        </p>

      </div>

      <div class="usuario-info">

        <span id="nombreUsuario">
          Trabajador
        </span>

      </div>

    </header>

    <!-- RESUMEN -->

    <section class="cards-grid">

      <div class="card">

        <h3>
          Cobros Hoy
        </h3>

        <p id="cobrosHoy">
          $0
        </p>

      </div>

      <div class="card">

        <h3>
          Pendientes
        </h3>

        <p id="pendientes">
          0
        </p>

      </div>

      <div class="card">

        <h3>
          Recaudado
        </h3>

        <p id="totalRecaudado">
          $0
        </p>

      </div>

    </section>

    <!-- FILTROS -->

    <section class="search-section">

      <input
        type="text"
        id="buscarCobranza"
        placeholder="Buscar cliente o préstamo..."
      />
      
      <section class="search-section">

  <label for="filtroEstado">
    Filtrar por estado
  </label>
      <select id="filtroEstado" 
      name="filtroEstado" >

        <option value="">
          Todos
        </option>

        <option value="pendiente">
          Pendiente
        </option>

        <option value="pagado">
          Pagado
        </option>

      </select>

    </section>

    <!-- TABLA -->

    <section class="table-section">

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>Cliente</th>

              <th>Préstamo</th>

              <th>Cuota</th>

              <th>Fecha</th>

              <th>Estado</th>

              <th>Acción</th>

            </tr>

          </thead>

          <tbody id="tablaCobranzas">

            <!-- DATOS DINÁMICOS -->

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- ===================================== -->
  <!-- MODAL REGISTRAR PAGO -->
  <!-- ===================================== -->

  <div
    class="modal hidden"
    id="modalPago"
  >

    <div class="modal-content">

      <h2>
        Registrar Pago
      </h2>

      <form id="formPago">

        <div class="form-group">

          <label for="montoPagado">
            Monto Pagado
          </label>

          <input
            type="number"
            id="montoPagado"
            required
          />

        </div>

        <div class="form-group">

          <label for="metodoPago">
            Método Pago
          </label>

          <select
            id="metodoPago"
            required
          >

            <option value="">
              Seleccione
            </option>

            <option value="efectivo">
              Efectivo
            </option>

            <option value="transferencia">
              Transferencia
            </option>

            <option value="nequi">
              Nequi
            </option>

          </select>

        </div>

        <div class="modal-actions">

          <button
            type="submit"
            class="btn-primary"
          >
            Guardar
          </button>

          <button
            type="button"
            id="cerrarModal"
            class="btn-secondary"
          >
            Cancelar
          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- ===================================== -->
  <!-- JS -->
  <!-- ===================================== -->

  <script
    type="module"
    src="../../js/trabajador/cobranzas.js"
  ></script>

</body>

</html>
