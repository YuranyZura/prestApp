<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Préstamos | PrestApp</title>

<meta
  name="description"
  content="Control general de préstamos registrados"
>

<link
  rel="shortcut icon"
  href="/assets/images/logos/favicon.png"
>

<link
  rel="stylesheet"
  href="/assets/css/styles.css"
>

<link
  rel="stylesheet"
  href="/assets/css/icons/tabler-icons/tabler-icons.css"
>

<style>
body{
  background:#f5f7fa;
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
}

.layout{
  display:flex;
  min-height:100vh;
}

/* =========================
SIDEBAR
========================= */
.sidebar{
  width:260px;
  background:#111827;
  color:#fff;
  padding:20px;
  transition:.3s;
}

.sidebar h4{
  font-weight:700;
  margin-bottom:25px;
}

.sidebar a,
.sidebar button{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border:none;
  border-radius:10px;
  background:none;
  color:#fff;
  text-decoration:none;
  text-align:left;
  transition:.2s;
}

.sidebar a:hover,
.sidebar button:hover,
.sidebar .active{
  background:#2563eb;
}

/* =========================
MAIN
========================= */
.main{
  flex:1;
  padding:30px;
}

.card-box{
  border:none;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.total{
  font-size:28px;
  font-weight:700;
  color:#2563eb;
}

.badge-activo{
  background:#198754;
}

.badge-pagado{
  background:#0d6efd;
}

.badge-mora{
  background:#dc3545;
}

.table td,
.table th{
  vertical-align:middle;
}

.logo-img{
  max-width:170px;
  width:100%;
  height:auto;
}

/* =========================
HEADER MOBILE
========================= */
.mobile-header{
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:#111827;
  color:#fff;
}

.mobile-header .btn{
  border:none;
}

/* =========================
RESPONSIVE
========================= */
@media(max-width:991px){

  .sidebar{
    position:fixed;
    top:0;
    left:-280px;
    width:260px;
    height:100%;
    z-index:1050;
  }

  .sidebar.show{
    left:0;
  }

  .mobile-header{
    display:flex;
  }

  .main{
    width:100%;
    padding:20px;
  }

}

@media(max-width:768px){

  .main{
    padding:15px;
  }

  .table-responsive{
    border-radius:12px;
  }

  .total{
    font-size:22px;
  }

}
</style>
</head>

<body>

<!-- HEADER MOBILE -->
<div class="mobile-header">

<button
  type="button"
  class="btn btn-light"
  id="btnMenu"
  title="Abrir menú"
  aria-label="Abrir menú lateral"
>
  <i class="ti ti-menu-2"></i>
</button>

<strong>PrestApp</strong>

<div></div>

</div>

<div class="layout">

<!-- SIDEBAR -->
<aside
  class="sidebar"
  id="sidebar"
>

<div class="text-center mb-4">

<img
  src="/assets/images/logos/prestapp-remove.png"
  alt="Logo PrestApp"
  class="logo-img"
>

</div>

<a href="/dashboard">
<i class="ti ti-home"></i>
Dashboard
</a>

<a href="/html/admin/clientes.html">
<i class="ti ti-users"></i>
Clientes
</a>

<a
  href="/html/admin/prestamos.html"
  class="active"
>
<i class="ti ti-cash"></i>
Préstamos
</a>

<a href="/html/admin/crearPrestamo.html">
<i class="ti ti-plus"></i>
Nuevo préstamo
</a>

<a href="/html/admin/pagos.html">
<i class="ti ti-credit-card"></i>
Pagos
</a>

<a
  href="/html/admin/administradores.html"
  id="menuUsuarios"
>
<i class="ti ti-user-cog"></i>
Usuarios
</a>

<hr>

<button
  type="button"
  id="btnLogout"
  title="Cerrar sesión"
  aria-label="Cerrar sesión"
>
<i class="ti ti-logout"></i>
Cerrar sesión
</button>

</aside>

<!-- MAIN -->
<main class="main">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

<div>

<h2 class="fw-bold mb-1">
Préstamos
</h2>

<p class="text-muted mb-0">
Control general de préstamos registrados
</p>

</div>

<a
  href="/html/admin/crearPrestamo.html"
  class="btn btn-primary"
>
<i class="ti ti-plus"></i>
Nuevo préstamo
</a>

</div>

<!-- STATS -->
<div class="row g-3 mb-4">

<div class="col-6 col-lg-3">
<div class="card card-box p-3">

<h6>Total préstamos</h6>

<div
  class="total"
  id="totalPrestamos"
>
0
</div>

</div>
</div>

<div class="col-6 col-lg-3">
<div class="card card-box p-3">

<h6>Activos</h6>

<div
  class="total"
  id="prestamosActivos"
>
0
</div>

</div>
</div>

<div class="col-6 col-lg-3">
<div class="card card-box p-3">

<h6>Pagados</h6>

<div
  class="total"
  id="prestamosPagados"
>
0
</div>

</div>
</div>

<div class="col-6 col-lg-3">
<div class="card card-box p-3">

<h6>Monto prestado</h6>

<div
  class="total"
  id="montoTotal"
>
$0
</div>

</div>
</div>

</div>

<!-- FILTROS -->
<div class="card card-box p-4 mb-4">

<div class="row g-3">

<div class="col-md-5">

<label
  for="buscar"
  class="form-label"
>
Buscar cliente
</label>

<input
  type="text"
  id="buscar"
  class="form-control"
  placeholder="Nombre o cédula"
  title="Buscar cliente"
  aria-label="Buscar cliente"
>

</div>

<div class="col-md-3">

<label
  for="estado"
  class="form-label"
>
Estado
</label>

<select
  id="estado"
  class="form-select"
  title="Filtrar por estado"
  aria-label="Filtrar por estado"
>

<option value="">
Todos
</option>

<option value="activo">
Activo
</option>

<option value="pagado">
Pagado
</option>

<option value="mora">
Mora
</option>

</select>

</div>

<div class="col-md-2 d-flex align-items-end">

<button
  type="button"
  class="btn btn-outline-primary w-100"
  onclick="filtrarPrestamos()"
  title="Buscar préstamos"
  aria-label="Buscar préstamos"
>
Buscar
</button>

</div>

<div class="col-md-2 d-flex align-items-end">

<button
  type="button"
  class="btn btn-outline-secondary w-100"
  onclick="limpiarFiltros()"
  title="Limpiar filtros"
  aria-label="Limpiar filtros"
>
Limpiar
</button>

</div>

</div>

</div>

<!-- TABLA -->
<div class="card card-box p-4">

<div class="table-responsive">

<table class="table align-middle">

<thead>

<tr>
<th>Cliente</th>
<th>Monto</th>
<th>Total</th>
<th>Cuota</th>
<th>Inicio</th>
<th>Final</th>
<th>Estado</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tablaPrestamos">

<tr>

<td
  colspan="8"
  class="text-center py-4"
>
Cargando préstamos...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API="/api";

let prestamosGlobal=[];
let usuario=null;

/* =========================
VALIDAR SESIÓN
========================= */
async function validarSesion(){

try{

const res=await fetch(`${API}/auth/check`,{
credentials:"include"
});

if(!res.ok){
location.href="/login";
return;
}

const data=await res.json();

usuario=data.usuario;

/* trabajador no ve usuarios */
if(usuario.rol_id==3){

document.getElementById("menuUsuarios")
.style.display="none";

}

}catch(error){

location.href="/login";

}

}

/* =========================
MENU MOBILE
========================= */
document.getElementById("btnMenu")
.addEventListener("click",()=>{

document.getElementById("sidebar")
.classList.toggle("show");

});

/* =========================
CARGAR PRESTAMOS
========================= */
async function cargarPrestamos(){

try{

const res=await fetch(`${API}/prestamos`,{
credentials:"include"
});

const data=await res.json();

if(!data.success){
return;
}

prestamosGlobal=data.prestamos || [];

renderPrestamos(prestamosGlobal);

estadisticas(prestamosGlobal);

}catch(error){

console.error(error);

}

}

/* =========================
RENDER TABLA
========================= */
function renderPrestamos(lista){

const tbody=
document.getElementById("tablaPrestamos");

if(!lista.length){

tbody.innerHTML=`
<tr>
<td colspan="8" class="text-center py-4">
No hay préstamos registrados
</td>
</tr>
`;

return;

}

tbody.innerHTML=lista.map(p=>{

let badge=
'<span class="badge badge-activo">Activo</span>';

if(p.estado==="pagado"){

badge=
'<span class="badge badge-pagado">Pagado</span>';

}

if(p.estado==="mora"){

badge=
'<span class="badge badge-mora">Mora</span>';

}

return `
<tr>

<td>${p.nombreCompleto || "-"}</td>

<td>
$${Number(p.monto || 0).toLocaleString()}
</td>

<td>
$${Number(p.total_pagar || 0).toLocaleString()}
</td>

<td>
$${Number(p.cuota_diaria || 0).toLocaleString()}
</td>

<td>
${formatearFecha(p.fecha_inicio)}
</td>

<td>
${formatearFecha(p.fecha_final)}
</td>

<td>${badge}</td>

<td>

<a
href="/html/admin/detalle_cliente.html?id=${p.id_clientes}"
class="btn btn-sm btn-primary mb-1"
title="Ver detalle"
aria-label="Ver detalle del préstamo"
>
Ver
</a>

<button
type="button"
class="btn btn-sm btn-danger mb-1"
onclick="eliminarPrestamo(${p.id_prestamos})"
title="Eliminar préstamo"
aria-label="Eliminar préstamo"
>
Eliminar
</button>

</td>

</tr>
`;

}).join("");

}

/* =========================
ESTADISTICAS
========================= */
function estadisticas(lista){

document.getElementById("totalPrestamos")
.textContent=lista.length;

const activos=
lista.filter(x=>x.estado==="activo").length;

const pagados=
lista.filter(x=>x.estado==="pagado").length;

const monto=
lista.reduce((acc,x)=>{

return acc + Number(x.monto || 0);

},0);

document.getElementById("prestamosActivos")
.textContent=activos;

document.getElementById("prestamosPagados")
.textContent=pagados;

document.getElementById("montoTotal")
.textContent=
"$"+monto.toLocaleString();

}

/* =========================
FILTRAR
========================= */
function filtrarPrestamos(){

const texto=
document.getElementById("buscar")
.value
.toLowerCase()
.trim();

const estado=
document.getElementById("estado").value;

const lista=
prestamosGlobal.filter(p=>{

const nombre=
(p.nombreCompleto || "")
.toLowerCase();

const cedula=
(p.cedula || "")
.toLowerCase();

const coincideTexto=
nombre.includes(texto) ||
cedula.includes(texto);

const coincideEstado=
!estado || p.estado===estado;

return coincideTexto && coincideEstado;

});

renderPrestamos(lista);

estadisticas(lista);

}

/* =========================
LIMPIAR
========================= */
function limpiarFiltros(){

document.getElementById("buscar").value="";
document.getElementById("estado").value="";

renderPrestamos(prestamosGlobal);

estadisticas(prestamosGlobal);

}

/* =========================
ELIMINAR
========================= */
async function eliminarPrestamo(id){

if(!confirm("¿Eliminar préstamo?")){
return;
}

try{

const res=
await fetch(`${API}/prestamos/${id}`,{
method:"DELETE",
credentials:"include"
});

const data=await res.json();

if(data.success){

cargarPrestamos();

}else{

alert(
data.message ||
"No se pudo eliminar"
);

}

}catch(error){

console.error(error);

alert("Error eliminando préstamo");

}

}

/* =========================
FECHA
========================= */
function formatearFecha(valor){

if(!valor){
return "-";
}

return new Date(valor)
.toLocaleDateString("es-DO");

}

/* =========================
LOGOUT
========================= */
document.getElementById("btnLogout")
.addEventListener("click", async ()=>{

try{

await fetch(`${API}/auth/logout`,{
method:"POST",
credentials:"include"
});

}catch(error){

console.error(error);

}

location.href="/login";

});

/* =========================
INIT
========================= */
(async()=>{

await validarSesion();

await cargarPrestamos();

})();
</script>

</body>
</html>
