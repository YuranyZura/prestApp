<body>

<div class="mobile-header d-lg-none">

<button
type="button"
id="btnMenu"
class="btn btn-light"
title="Abrir menú"
aria-label="Abrir menú">

<i class="ti ti-menu-2"></i>

</button>

<h5 class="mb-0 fw-bold">
PrestApp
</h5>

</div>

<div class="layout">

<!-- OVERLAY -->
<div id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside
class="sidebar"
id="sidebar">

<div class="sidebar-header">

<img
src="/assets/images/logos/prestapp-remove.png"
alt="PrestApp"
class="sidebar-logo">

</div>

<nav class="sidebar-menu">

<a href="/dashboard">
<i class="ti ti-home"></i>
<span>Dashboard</span>
</a>

<a href="/dashboard/clientes">
<i class="ti ti-users"></i>
<span>Clientes</span>
</a>

<a href="/dashboard/prestamos">
<i class="ti ti-cash"></i>
<span>Préstamos</span>
</a>

<a
href="/dashboard/pagos"
class="active">

<i class="ti ti-credit-card"></i>
<span>Pagos</span>

</a>

</nav>

<div class="sidebar-footer">

<button
id="btnLogout"
class="btn btn-danger w-100"
title="Cerrar sesión"
aria-label="Cerrar sesión">

<i class="ti ti-logout"></i>
Cerrar sesión

</button>

</div>

</aside>

<!-- MAIN -->
<main class="main-content">

<div class="page-header mb-4">

<h2 class="fw-bold">
Pagos
</h2>

<p class="text-muted mb-0">
Registrar y administrar cobros diarios
</p>

</div>

<!-- STATS -->
<div class="row g-3 mb-4">

<div class="col-6 col-lg-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>Total cobrado</h6>

<h3 id="pagosHoy">$0</h3>

</div>

</div>

</div>

<div class="col-6 col-lg-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>Pagos</h6>

<h3 id="cantidadPagos">0</h3>

</div>

</div>

</div>

<div class="col-12 col-lg-4">

<div class="card dashboard-card">

<div class="card-body">

<h6>Pendientes</h6>

<h3 id="pendientes">0</h3>

</div>

</div>

</div>

</div>

<div class="row g-4">

<!-- FORM -->
<div class="col-xl-4">

<div class="card app-card">

<div class="card-body">

<h5 class="mb-4">
Registrar Pago
</h5>

<form id="formPago">

<div class="mb-3">

<label
for="prestamo"
class="form-label">

Préstamo

</label>

<select
id="prestamo"
name="prestamo"
class="form-select"
required
title="Seleccionar préstamo"
aria-label="Seleccionar préstamo">

<option value="">
Seleccione préstamo
</option>

</select>

</div>

<div class="mb-3">

<label
for="monto"
class="form-label">

Monto

</label>

<input
type="number"
id="monto"
name="monto"
class="form-control"
placeholder="Ej: 500"
required
autocomplete="off"
title="Monto del pago"
aria-label="Monto del pago">

</div>

<div class="mb-3">

<label
for="metodo"
class="form-label">

Método

</label>

<select
id="metodo"
name="metodo"
class="form-select"
required
title="Método de pago"
aria-label="Método de pago">

<option value="efectivo">
Efectivo
</option>

<option value="transferencia">
Transferencia
</option>

<option value="nequi">
Nequi
</option>

</select>

</div>

<div class="mb-4">

<label
for="fecha_pago"
class="form-label">

Fecha

</label>

<input
type="date"
id="fecha_pago"
name="fecha_pago"
class="form-control"
required
title="Fecha del pago"
aria-label="Fecha del pago">

</div>

<button
type="submit"
id="btnGuardarPago"
class="btn btn-primary w-100">

Guardar Pago

</button>

</form>

</div>

</div>

</div>

<!-- TABLA -->
<div class="col-xl-8">

<div class="card app-card">

<div class="card-body">

<div class="d-flex justify-content-between align-items-center mb-3">

<h5 class="mb-0">
Historial de pagos
</h5>

<button
type="button"
  class="btn-close"
  data-bs-dismiss="modal"
  aria-label="historial de pagos"
  title="Cerrar historial de pagos">

</button>

</div>

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>
<th>Cliente</th>
<th>Monto</th>
<th>Fecha</th>
<th>Método</th>
<th>Estado</th>
</tr>

</thead>

<tbody id="tablaPagos">

<tr>

<td
colspan="5"
class="text-center py-4">

Cargando pagos...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</main>

</div>

</body>
