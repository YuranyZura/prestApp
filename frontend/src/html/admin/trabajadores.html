<!doctype html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gestión profesional de trabajadores PrestApp">

<title>PrestApp - Trabajadores</title>

<link rel="shortcut icon" href="/assets/images/logos/favicon.png">

<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/administradores.css">
<link rel="stylesheet" href="/assets/css/icons/tabler-icons/tabler-icons.css">

<style>
body{
  background:#f5f7fa;
  overflow-x:hidden;
}

.card-box{
  border:none;
  border-radius:18px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.left-sidebar.show{
  left:0;
}

@media(max-width:991px){
.left-sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  z-index:1050;
  transition:.3s;
}
}
</style>
</head>

<body>

<div class="page-wrapper">

<!-- SIDEBAR -->
<aside class="left-sidebar bg-white border-end">

<div class="brand-logo text-center p-3">
<img
src="/assets/images/logos/prestapp-remove.png"
width="160"
alt="PrestApp">
</div>

<nav class="sidebar-nav px-2">

<a href="/html/admin/dashboard.html" class="sidebar-link">
<i class="ti ti-layout-dashboard"></i>
<span>Dashboard</span>
</a>

<a href="/html/admin/trabajadores.html" class="sidebar-link active">
<i class="ti ti-users"></i>
<span>Trabajadores</span>
</a>

<button
type="button"
id="btnLogout"
class="sidebar-link btn btn-link text-start w-100 text-danger">

<i class="ti ti-logout"></i>
<span>Cerrar sesión</span>
</button>

</nav>
</aside>

<!-- CONTENT -->
<div class="body-wrapper">

<!-- HEADER -->
<header class="app-header border-bottom bg-white">
<nav class="navbar navbar-light px-3">

<button
type="button"
class="btn btn-light d-lg-none"
id="btnMenu"
title="Abrir menú"
aria-label="Abrir menú">

<i class="ti ti-menu-2"></i>
</button>

<div class="ms-auto d-flex align-items-center gap-2">

<button
type="button"
class="btn btn-light"
title="Notificaciones"
aria-label="Notificaciones">

<i class="ti ti-bell"></i>
</button>

<img
src="/assets/images/profile/user-1.jpg"
width="36"
height="36"
alt="Usuario"
class="rounded-circle">

</div>

</nav>
</header>

<!-- MAIN -->
<main class="container-fluid p-4">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

<div>
<h1 class="h3 fw-bold mb-1">Trabajadores</h1>
<p class="text-muted mb-0">
Administra empleados y cobradores
</p>
</div>

<button
type="button"
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalTrabajador">

<i class="ti ti-plus"></i>
Agregar
</button>

</div>

<!-- BUSCADOR -->
<div class="card card-box p-3 mb-4">

<label for="buscar" class="form-label">
Buscar trabajador
</label>

<input
type="search"
id="buscar"
class="form-control"
placeholder="Nombre, cédula o correo"
title="Buscar trabajador">

</div>

<!-- TABLA -->
<div class="card card-box p-3">

<div class="table-responsive">

<table class="table align-middle">

<thead>
<tr>
<th>Foto</th>
<th>Nombre</th>
<th>Cédula</th>
<th>Celular</th>
<th>Correo</th>
<th class="text-center">Acciones</th>
</tr>
</thead>

<tbody id="tablaTrabajadores">

<tr>
<td colspan="6" class="text-center py-4">
Cargando trabajadores...
</td>
</tr>

</tbody>

</table>

</div>
</div>

</main>

</div>
</div>

<!-- MODAL -->
<div
class="modal fade"
id="modalTrabajador"
tabindex="-1"
aria-hidden="true">

<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">

<div class="modal-header">

<h2 class="modal-title fs-5">
Nuevo Trabajador
</h2>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
title="Cerrar"
aria-label="Cerrar">
</button>

</div>

<div class="modal-body">

<form id="formTrabajador">

<div class="mb-3">
<label for="nombre" class="form-label">
Nombre
</label>

<input
type="text"
id="nombre"
class="form-control"
required
placeholder="Ingrese nombre"
title="Nombre">
</div>

<div class="mb-3">
<label for="apellido" class="form-label">
Apellido
</label>

<input
type="text"
id="apellido"
class="form-control"
required
placeholder="Ingrese apellido"
title="Apellido">
</div>

<div class="mb-3">
<label for="cedula" class="form-label">
Cédula
</label>

<input
type="text"
id="cedula"
class="form-control"
required
placeholder="Ingrese cédula"
title="Cédula">
</div>

<div class="mb-3">
<label for="celular" class="form-label">
Celular
</label>

<input
type="text"
id="celular"
class="form-control"
required
placeholder="Ingrese celular"
title="Celular">
</div>

<div class="mb-3">
<label for="correo" class="form-label">
Correo
</label>

<input
type="email"
id="correo"
class="form-control"
required
placeholder="correo@empresa.com"
title="Correo">
</div>

<div class="mb-3">
<label for="foto" class="form-label">
Foto
</label>

<input
type="file"
id="foto"
class="form-control"
accept="image/*"
title="Seleccionar foto">
</div>

</form>

</div>

<div class="modal-footer">

<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">
Cancelar
</button>

<button
type="button"
class="btn btn-primary"
id="btnGuardar">
Guardar
</button>

</div>

</div>
</div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "/api/trabajadores";
const token = localStorage.getItem("token");

const tabla = document.getElementById("tablaTrabajadores");
const buscador = document.getElementById("buscar");

let trabajadores = [];

/* =========================
MENU MOBILE
========================= */
const btnMenu =
document.getElementById("btnMenu");

const sidebar =
document.querySelector(".left-sidebar");

btnMenu?.addEventListener("click",()=>{

sidebar.classList.toggle("show");

});

/* =========================
LOGOUT
========================= */
document.getElementById("btnLogout")
.addEventListener("click",()=>{

localStorage.removeItem("token");
location.href="/login";

});

/* =========================
FORMATO
========================= */
function textoSeguro(valor){

return valor || "-";

}

/* =========================
CARGAR
========================= */
async function cargarTrabajadores(){

try{

const res = await fetch(API,{
headers:{
Authorization:`Bearer ${token}`
}
});

const data = await res.json();

trabajadores = data.trabajadores || [];

render(trabajadores);

}catch(error){

console.error(error);

tabla.innerHTML = `
<tr>
<td colspan="6" class="text-center text-danger py-4">
Error al cargar trabajadores
</td>
</tr>
`;

}

}

/* =========================
RENDER
========================= */
function render(lista){

if(!lista.length){

tabla.innerHTML = `
<tr>
<td colspan="6" class="text-center py-4">
No hay trabajadores
</td>
</tr>
`;

return;

}

tabla.innerHTML = lista.map(t=>`

<tr>

<td>
<img
src="${t.foto || '/assets/images/profile/user-1.jpg'}"
class="avatar"
alt="Foto de ${textoSeguro(t.nombre)}">
</td>

<td>
${textoSeguro(t.nombre)}
${textoSeguro(t.apellido)}
</td>

<td>
${textoSeguro(t.cedula)}
</td>

<td>
${textoSeguro(t.celular)}
</td>

<td>
${textoSeguro(t.correo)}
</td>

<td class="text-center">

<a
href="/html/admin/detalle_trabajador.html?id=${t.id}"
class="btn btn-sm btn-primary mb-1"
title="Ver trabajador"
aria-label="Ver trabajador">

Ver

</a>

<button
type="button"
class="btn btn-sm btn-danger btn-eliminar"
data-id="${t.id}"
title="Eliminar trabajador"
aria-label="Eliminar trabajador">

Eliminar

</button>

</td>

</tr>

`).join("");

activarEventosEliminar();

}

/* =========================
EVENTOS ELIMINAR
========================= */
function activarEventosEliminar(){

const botones =
document.querySelectorAll(".btn-eliminar");

botones.forEach(btn=>{

btn.addEventListener("click", async ()=>{

const id = btn.dataset.id;

if(!confirm("¿Eliminar trabajador?")){
return;
}

try{

const res = await fetch(`${API}/${id}`,{
method:"DELETE",
headers:{
Authorization:`Bearer ${token}`
}
});

const data = await res.json();

if(data.success){

cargarTrabajadores();

}else{

alert(data.message || "No se pudo eliminar");

}

}catch(error){

console.error(error);
alert("Error eliminando trabajador");

}

});

});

}

/* =========================
BUSCAR
========================= */
buscador.addEventListener("input",()=>{

const texto =
buscador.value
.toLowerCase()
.trim();

const filtrado = trabajadores.filter(t=>{

const nombre =
`${t.nombre || ""} ${t.apellido || ""}`
.toLowerCase();

const cedula =
(t.cedula || "")
.toLowerCase();

const correo =
(t.correo || "")
.toLowerCase();

return (
nombre.includes(texto) ||
cedula.includes(texto) ||
correo.includes(texto)
);

});

render(filtrado);

});

/* =========================
GUARDAR
========================= */
document.getElementById("btnGuardar")
.addEventListener("click", async ()=>{

try{

const fd = new FormData();

fd.append("nombre",nombre.value);
fd.append("apellido",apellido.value);
fd.append("cedula",cedula.value);
fd.append("celular",celular.value);
fd.append("correo",correo.value);

if(foto.files[0]){

fd.append("foto",foto.files[0]);

}

const res = await fetch(API,{
method:"POST",
headers:{
Authorization:`Bearer ${token}`
},
body:fd
});

const data = await res.json();

if(data.success){

bootstrap.Modal.getInstance(
document.getElementById("modalTrabajador")
).hide();

document.getElementById("formTrabajador")
.reset();

cargarTrabajadores();

}else{

alert(data.message || "Error guardando");

}

}catch(error){

console.error(error);
alert("Error del servidor");

}

});

/* =========================
INIT
========================= */
cargarTrabajadores();
</script>

</body>
</html>
