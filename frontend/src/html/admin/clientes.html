<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>PrestApp | Clientes</title>

<!-- Bootstrap -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!-- CSS GLOBAL -->
<link rel="stylesheet" href="/assets/css/base/reset.css" />
<link rel="stylesheet" href="/assets/css/base/variables.css" />
<link rel="stylesheet" href="/assets/css/base/global.css" />
<link rel="stylesheet" href="/assets/css/layout/template.css" />
<link rel="stylesheet" href="/assets/css/pages/administradores.css" />

<!-- ICONOS -->
<link
  rel="stylesheet"
  href="/assets/css/icons/tabler-icons/tabler-icons.css"
/>

<style>
/* =========================================
   CLIENTES PAGE
========================================= */

body {
  background: var(--light-bg);
}

.app-layout {
  display: flex;
  min-height: 100vh;
}

/* ================================
SIDEBAR
================================ */

.sidebar {
  width: 270px;
  background: #111827;
  color: #fff;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 1040;
  transition: transform .3s ease;
}

.sidebar-header {
  padding: 24px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-logo {
  width: 170px;
}

.sidebar-menu {
  padding: 20px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: none;
  text-decoration: none;
  background: transparent;
  color: #d1d5db;
  padding: 14px 16px;
  border-radius: 12px;
  transition: .2s;
  font-weight: 600;
  margin-bottom: 8px;
}

.sidebar-link:hover {
  background: #1f2937;
  color: #fff;
}

.sidebar-link.active {
  background: var(--primary-color);
  color: #fff;
}

.sidebar-link i {
  font-size: 20px;
}

/* ================================
MAIN
================================ */

.main-content {
  flex: 1;
  margin-left: 270px;
  min-height: 100vh;
}

.topbar {
  background: #fff;
  border-bottom: 1px solid var(--border-color);
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 1030;
}

.topbar-title h4 {
  margin: 0;
  font-weight: 700;
}

.topbar-title p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.page-content {
  padding: 24px;
}

/* ================================
CARDS
================================ */

.card-custom {
  border: none;
  border-radius: 18px;
  box-shadow: var(--shadow-md);
  background: #fff;
}

.stats-card {
  padding: 22px;
}

.stats-card small {
  color: var(--text-secondary);
  font-weight: 500;
}

.stats-card h3 {
  font-weight: 800;
  margin-top: 10px;
}

/* ================================
TABLE
================================ */

.table {
  margin: 0;
}

.table thead th {
  border: none;
  background: #f3f4f6;
  color: #374151;
  font-size: 14px;
  font-weight: 700;
}

.table td {
  vertical-align: middle;
}

.avatar-cliente {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.estado-badge {
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}

.estado-activo {
  background: rgba(25,135,84,.12);
  color: #198754;
}

.estado-prestamo {
  background: rgba(255,193,7,.15);
  color: #856404;
}

/* ================================
MOBILE
================================ */

.mobile-toggle {
  display: none;
}

.sidebar-overlay {
  display: none;
}

@media (max-width: 991px) {

  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.show {
    transform: translateX(0);
  }

  .main-content {
    margin-left: 0;
  }

  .mobile-toggle {
    display: inline-flex;
  }

  .sidebar-overlay.show {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 1035;
  }

  .page-content {
    padding: 16px;
  }

  .topbar {
    padding: 14px 16px;
  }

  .topbar-title h4 {
    font-size: 20px;
  }

  .btn-mobile-full {
    width: 100%;
  }

}

@media (max-width: 576px) {

  .table-responsive {
    font-size: 13px;
  }

  .stats-card {
    padding: 18px;
  }

}
</style>
</head>

<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header text-center">
      <img
        src="/assets/images/logos/prestapp-remove.png"
        alt="PrestApp"
        class="sidebar-logo"
      />
    </div>

    <div class="sidebar-menu">

      <a href="/dashboard" class="sidebar-link">
        <i class="ti ti-layout-dashboard"></i>
        Dashboard
      </a>

      <a
        href="/dashboard/clientes"
        class="sidebar-link active"
      >
        <i class="ti ti-users"></i>
        Clientes
      </a>

      <a href="/dashboard/prestamos" class="sidebar-link">
        <i class="ti ti-cash-banknote"></i>
        Préstamos
      </a>

      <a href="/dashboard/pagos" class="sidebar-link">
        <i class="ti ti-currency-dollar"></i>
        Pagos
      </a>

      <a
        href="/dashboard/trabajadores"
        class="sidebar-link"
        id="menuTrabajadores"
      >
        <i class="ti ti-user-star"></i>
        Trabajadores
      </a>

      <hr class="border-secondary my-4">

      <button
        id="btnLogout"
        class="sidebar-link text-danger"
      >
        <i class="ti ti-logout"></i>
        Cerrar sesión
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="d-flex align-items-center gap-3">

        <button
          class="btn btn-light mobile-toggle"
          id="btnToggleSidebar"
        >
          <i class="ti ti-menu-2"></i>
        </button>

        <div class="topbar-title">
          <h4>Clientes</h4>
          <p>Administración completa de clientes</p>
        </div>

      </div>

      <div class="topbar-actions">

        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#modalCliente"
        >
          <i class="ti ti-user-plus"></i>
          Nuevo Cliente
        </button>

      </div>

    </header>

    <!-- CONTENT -->
    <section class="page-content">

      <!-- STATS -->
      <div class="row g-3 mb-4">

        <div class="col-md-6 col-xl-3">
          <div class="card-custom stats-card">
            <small>Total Clientes</small>
            <h3 id="statTotal">0</h3>
          </div>
        </div>

        <div class="col-md-6 col-xl-3">
          <div class="card-custom stats-card">
            <small>Clientes Activos</small>
            <h3 id="statActivos">0</h3>
          </div>
        </div>

        <div class="col-md-6 col-xl-3">
          <div class="card-custom stats-card">
            <small>Con Préstamo</small>
            <h3 id="statPrestamo">0</h3>
          </div>
        </div>

        <div class="col-md-6 col-xl-3">
          <div class="card-custom stats-card">
            <small>Nuevos Hoy</small>
            <h3 id="statHoy">0</h3>
          </div>
        </div>

      </div>

      <!-- FILTROS -->
      <div class="card-custom p-4 mb-4">

        <div class="row g-3 align-items-end">

          <div class="col-lg-4">

            <label class="form-label">
              Buscar cliente
            </label>

            <input
              type="text"
              id="buscarCliente"
              class="form-control"
              placeholder="Nombre, teléfono o cédula"
            />

          </div>

          <div class="col-lg-3">

            <label
              for="filtroEstado"
              class="form-label"
            >
              Estado

            </label>

            <select
              id="filtroEstado"
              name="filtroEstado"
              class="form-select"
              title="Filtrar clientes por estado"
              aria-label="Filtrar clientes por estado"
            >
              <option value="">Todos</option>
              <option value="activo">Activos</option>
              <option value="prestamo">Con préstamo</option>
            </select>

          </div>

          <div class="col-lg-2 d-grid">

            <button
              class="btn btn-outline-primary"
              onclick="cargarClientes()"
            >
              Buscar
            </button>

          </div>

        </div>

      </div>

      <!-- TABLA -->
      <div class="card-custom p-3">

        <div class="table-responsive">

          <table class="table align-middle">

            <thead>
              <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tablaClientes">

              <tr>
                <td colspan="7" class="text-center py-5">
                  Cargando clientes...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>

</div>

<!-- MODAL -->
<div
  class="modal fade"
  id="modalCliente"
  tabindex="-1"
>

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content border-0 rounded-4">

      <div class="modal-header">

        <h5 class="modal-title fw-bold">
          Registrar Cliente
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
          title="Cerrar ventana"
          ></button>

      </div>

      <div class="modal-body">

        <form id="formCliente">

          <div class="row g-3">

            <div class="col-md-6">

              <label class="form-label">
                Nombre completo
              </label>

              <input
                 type="text"
                  id="nombreCliente"
                  class="form-control"
                 placeholder="Ingrese nombre del cliente"
                 title="Nombre del cliente"
                 required
              />

            </div>

            <div class="col-md-6">

              <label class="form-label">
                Cédula
              </label>

              <input
                type="text"
                id="cedulaCliente"
                class="form-control"
                placeholder="Ingrese cédula del cliente"
                title="Cédula del cliente"
                required
              />

            </div>

            </div>

            <div class="col-md-6">

              <label class="form-label">
                Teléfono
              </label>

              <input
                type="text"
                id="telefonoCliente"
                class="form-control"
                placeholder="Ingrese teléfono del cliente"
                title="Teléfono del cliente"
                required
              />

            </div>

            <div class="col-md-6">

              <label class="form-label">
                Ciudad
              </label>

              <input
                type="text"
                id="ciudadCliente"
                class="form-control"
                placeholder="Ingrese ciudad del cliente"
                title="Ciudad del cliente"
                 required
              />

            </div>

            <div class="col-md-12">

              <label class="form-label">
                Dirección
              </label>

              <input
                 type="text"
                 id="direccionCliente"
                 class="form-control"
                 placeholder="Ingrese dirección del cliente"
                 title="Dirección del cliente"
                 required
              />

            </div>

            <div class="col-md-6">

              <label class="form-label">
                Fecha nacimiento
              </label>

              <input
                 type="text"
                 id="fechaNacimientoCliente"
                 class="form-control"
                   placeholder="Ingrese fecha de nacimiento"
                  title="Fecha de nacimiento"
                   required
              />

            </div>

          </div>

          <div class="mt-4 d-grid">

            <button
              type="submit"
              class="btn btn-primary"
            >
              Guardar Cliente
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "/api";

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");
const btnToggleSidebar =
  document.getElementById("btnToggleSidebar");

// =======================================
// SIDEBAR MOBILE
// =======================================
btnToggleSidebar?.addEventListener("click", () => {
  sidebar.classList.toggle("show");
  overlay.classList.toggle("show");
});

overlay?.addEventListener("click", () => {
  sidebar.classList.remove("show");
  overlay.classList.remove("show");
});

// =======================================
// VALIDAR SESIÓN
// =======================================
document.addEventListener("DOMContentLoaded", async () => {

  try {

    const res = await fetch("/api/auth/check", {
      credentials: "include"
    });

    if (!res.ok) {
      location.href = "/login";
      return;
    }

    const data = await res.json();

    if (data.usuario.id_rol === 3) {
      document
        .getElementById("menuTrabajadores")
        .style.display = "none";
    }

    cargarClientes();

  } catch (error) {
    location.href = "/login";
  }

});

// =======================================
// CARGAR CLIENTES
// =======================================
async function cargarClientes() {

  try {

    const buscar =
      document.getElementById("buscarCliente").value;

    const estado =
      document.getElementById("filtroEstado").value;

    const res = await fetch(`${API}/clientes`, {
      credentials: "include"
    });

    const data = await res.json();

    if (!data.success) return;

    let clientes = data.clientes || [];

    // FILTRO TEXTO
    if (buscar) {

      clientes = clientes.filter(c =>
        (
          c.nombreCompleto?.toLowerCase().includes(buscar.toLowerCase()) ||
          c.cedula?.includes(buscar) ||
          c.telefono?.includes(buscar)
        )
      );

    }

    renderClientes(clientes);
    renderStats(clientes);

  } catch (error) {
    console.error(error);
  }

}

// =======================================
// RENDER CLIENTES
// =======================================
function renderClientes(lista) {

  const tbody =
    document.getElementById("tablaClientes");

  if (!lista.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center py-5">
          No hay clientes registrados
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = lista.map(cliente => `

    <tr>

      <td>
        <img
          src="/uploads/${cliente.foto || 'user.png'}"
          class="avatar-cliente"
        />
      </td>

      <td class="fw-semibold">
        ${cliente.nombreCompleto || ''}
      </td>

      <td>${cliente.cedula || ''}</td>

      <td>${cliente.telefono || ''}</td>

      <td>${cliente.direccion || ''}</td>

      <td>
        <span class="estado-badge estado-activo">
          Activo
        </span>
      </td>

      <td>

        <div class="d-flex gap-2 flex-wrap">

          <a
            href="/dashboard/clientes/${cliente.id_clientes}"
            class="btn btn-sm btn-primary"
          >
            Ver
          </a>

          <button
            class="btn btn-sm btn-danger"
            onclick="eliminarCliente(${cliente.id_clientes})"
          >
            Eliminar
          </button>

        </div>

      </td>

    </tr>

  `).join("");

}

// =======================================
// STATS
// =======================================
function renderStats(lista) {

  document.getElementById("statTotal")
    .textContent = lista.length;

  document.getElementById("statActivos")
    .textContent = lista.length;

  document.getElementById("statPrestamo")
    .textContent = lista.filter(c => c.tienePrestamo).length;

  document.getElementById("statHoy")
    .textContent = lista.filter(c => {
      if (!c.fecha_registro) return false;

      const hoy = new Date().toISOString().split("T")[0];

      return c.fecha_registro.split("T")[0] === hoy;
    }).length;

}

// =======================================
// CREAR CLIENTE
// =======================================
document
  .getElementById("formCliente")
  .addEventListener("submit", async e => {

    e.preventDefault();

    try {

      const form =
        new FormData(e.target);

      const body =
        Object.fromEntries(form.entries());

      const res = await fetch(`${API}/clientes`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (!data.success) {
        alert(data.message || "Error");
        return;
      }

      bootstrap.Modal
        .getInstance(
          document.getElementById("modalCliente")
        )
        .hide();

      e.target.reset();

      cargarClientes();

      alert("Cliente creado correctamente");

    } catch (error) {
      console.error(error);
      alert("Error del servidor");
    }

  });

// =======================================
// ELIMINAR CLIENTE
// =======================================
async function eliminarCliente(id) {

  const confirmar =
    confirm("¿Eliminar cliente?");

  if (!confirmar) return;

  try {

    const res = await fetch(`${API}/clientes/${id}`, {
      method: "DELETE",
      credentials: "include"
    });

    const data = await res.json();

    if (data.success) {
      cargarClientes();
    }

  } catch (error) {
    console.error(error);
  }

}

// =======================================
// LOGOUT
// =======================================
document
  .getElementById("btnLogout")
  .addEventListener("click", async () => {

    try {

      await fetch("/api/auth/logout", {
        method: "POST",
        credentials: "include"
      });

      localStorage.clear();
      sessionStorage.clear();

      location.href = "/login";

    } catch (error) {
      console.error(error);
    }

  });
</script>

</body>
</html>
