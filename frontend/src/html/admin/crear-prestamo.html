<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>PrestApp | Crear préstamo</title>

<!-- Bootstrap -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!-- Icons -->
<link
  rel="stylesheet"
  href="/assets/css/icons/tabler-icons/tabler-icons.css"
/>

<!-- Global CSS -->
<link rel="stylesheet" href="/assets/css/base/reset.css" />
<link rel="stylesheet" href="/assets/css/base/variables.css" />
<link rel="stylesheet" href="/assets/css/base/global.css" />
<link rel="stylesheet" href="/assets/css/layout/template.css" />

<style>
/* =========================================
   PAGE: CREAR PRESTAMO
========================================= */

body {
  background: var(--light-bg);
}

.app-layout {
  display: flex;
  min-height: 100vh;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar {
  width: 270px;
  background: #111827;
  color: white;
  position: fixed;
  inset: 0 auto 0 0;
  overflow-y: auto;
  z-index: 1040;
  transition: transform .3s ease;
}

.sidebar-header {
  padding: 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-brand {
  font-size: 24px;
  font-weight: 800;
  margin: 0;
}

.sidebar-menu {
  padding: 20px;
}

.sidebar-link {
  width: 100%;
  border: none;
  background: transparent;
  color: #d1d5db;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  border-radius: 12px;
  text-decoration: none;
  margin-bottom: 8px;
  transition: .2s ease;
}

.sidebar-link:hover {
  background: rgba(255,255,255,.08);
  color: white;
}

.sidebar-link.active {
  background: var(--primary-color);
  color: white;
}

.sidebar-link i {
  font-size: 20px;
}

/* =========================================
   CONTENT
========================================= */

.main-content {
  flex: 1;
  margin-left: 270px;
  padding: 24px;
}

/* =========================================
   TOPBAR
========================================= */

.topbar {
  background: white;
  border-radius: 18px;
  padding: 16px 20px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}

.mobile-toggle {
  display: none;
}

/* =========================================
   CARDS
========================================= */

.card-prestapp {
  border: none;
  border-radius: 20px;
  background: white;
  box-shadow: var(--shadow-md);
}

.card-prestapp .card-body {
  padding: 24px;
}

/* =========================================
   RESUMEN
========================================= */

.resumen-box {
  background: linear-gradient(
    135deg,
    rgba(93,135,255,.08),
    rgba(93,135,255,.03)
  );

  border: 1px solid rgba(93,135,255,.12);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
}

.resumen-label {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 8px;
}

.resumen-value {
  font-size: 30px;
  font-weight: 800;
  color: var(--primary-color);
}

.fecha-final {
  font-size: 18px;
  font-weight: 700;
}

/* =========================================
   FORM
========================================= */

.form-label {
  font-weight: 700;
}

.form-control,
.form-select {
  min-height: 48px;
  border-radius: 12px;
}

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 991px) {

  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.show {
    transform: translateX(0);
  }

  .main-content {
    margin-left: 0;
  }

  .mobile-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

}

@media (max-width: 768px) {

  .main-content {
    padding: 14px;
  }

  .card-prestapp .card-body {
    padding: 18px;
  }

  .resumen-value {
    font-size: 24px;
  }

  .btn-mobile {
    width: 100%;
  }

}
</style>
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <h1 class="sidebar-brand">
        PrestApp
      </h1>
    </div>

    <div class="sidebar-menu">

      <a href="/dashboard" class="sidebar-link">
        <i class="ti ti-layout-dashboard"></i>
        Dashboard
      </a>

      <a href="/dashboard/clientes" class="sidebar-link">
        <i class="ti ti-users"></i>
        Clientes
      </a>

      <a href="/dashboard/prestamos" class="sidebar-link">
        <i class="ti ti-cash"></i>
        Préstamos
      </a>

      <a
        href="/dashboard/crear-prestamo"
        class="sidebar-link active"
      >
        <i class="ti ti-plus"></i>
        Nuevo préstamo
      </a>

      <a href="/dashboard/pagos" class="sidebar-link">
        <i class="ti ti-receipt"></i>
        Pagos
      </a>

      <a
        href="/dashboard/trabajadores"
        id="menuTrabajadores"
        class="sidebar-link"
      >
        <i class="ti ti-user-star"></i>
        Trabajadores
      </a>

      <hr class="border-secondary opacity-25 my-4">

      <button
        type="button"
        id="btnLogout"
        class="sidebar-link text-danger"
      >
        <i class="ti ti-logout"></i>
        Cerrar sesión
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="d-flex align-items-center gap-3">

        <button
          class="btn btn-light mobile-toggle"
          id="toggleSidebar"
        >
          <i class="ti ti-menu-2"></i>
        </button>

        <div>
          <h3 class="fw-bold mb-0">
            Crear préstamo
          </h3>

          <small class="text-muted">
            Registro y cálculo automático
          </small>
        </div>

      </div>

      <div class="d-none d-md-block">
        <span class="badge bg-primary">
          PrestApp
        </span>
      </div>

    </div>

    <!-- CONTENT -->
    <div class="row g-4">

      <!-- FORM -->
      <div class="col-xl-7">

        <div class="card card-prestapp">

          <div class="card-body">

            <h5 class="fw-bold mb-4">
              Datos del préstamo
            </h5>

            <form id="formPrestamo">

              <div class="mb-3">

                <label
                  for="cliente"
                  class="form-label"
                >
                  Cliente
                </label>

                <select
                  id="cliente"
                  name="id_clientes"
                  class="form-select"
                  required
                >
                  <option value="">
                    Cargando clientes...
                  </option>
                </select>

              </div>

              <div class="row g-3">

                <div class="col-md-6">

                  <label
                    for="monto"
                    class="form-label"
                  >
                    Monto prestado
                  </label>

                  <input
                    type="number"
                    id="monto"
                    name="monto"
                    class="form-control"
                    placeholder="10000"
                    required
                  />

                </div>

                <div class="col-md-6">

                  <label
                    for="interes"
                    class="form-label"
                  >
                    Interés %
                  </label>

                  <input
                    type="number"
                    id="interes"
                    name="interes"
                    class="form-control"
                    placeholder="20"
                    required
                  />

                </div>

                <div class="col-md-6">

                  <label
                    for="cuotas"
                    class="form-label"
                  >
                    Número de cuotas
                  </label>

                  <input
                    type="number"
                    id="cuotas"
                    name="numero_cuotas"
                    class="form-control"
                    placeholder="30"
                    required
                  />

                </div>

                <div class="col-md-6">

                  <label
                    for="fecha_inicio"
                    class="form-label"
                  >
                    Fecha inicio
                  </label>

                  <input
                    type="date"
                    id="fecha_inicio"
                    name="fecha_inicio"
                    class="form-control"
                    required
                  />

                </div>

              </div>

              <div class="mt-4 d-grid">

                <button
                  type="submit"
                  class="btn btn-primary btn-lg btn-mobile"
                >
                  <i class="ti ti-device-floppy me-1"></i>
                  Guardar préstamo
                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

      <!-- RESUMEN -->
      <div class="col-xl-5">

        <div class="card card-prestapp">

          <div class="card-body">

            <h5 class="fw-bold mb-4">
              Resumen automático
            </h5>

            <div class="resumen-box">

              <div class="resumen-label">
                Total a pagar
              </div>

              <div
                id="totalPagar"
                class="resumen-value"
              >
                $0
              </div>

            </div>

            <div class="resumen-box">

              <div class="resumen-label">
                Cuota diaria
              </div>

              <div
                id="cuotaDiaria"
                class="resumen-value"
              >
                $0
              </div>

            </div>

            <div class="resumen-box mb-0">

              <div class="resumen-label">
                Fecha final estimada
              </div>

              <div
                id="fechaFinal"
                class="fecha-final"
              >
                --
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "/api";

// ======================================
// SIDEBAR MOBILE
// ======================================

const sidebar =
document.getElementById("sidebar");

document
.getElementById("toggleSidebar")
.addEventListener("click", () => {

  sidebar.classList.toggle("show");

});

// ======================================
// VALIDAR SESIÓN
// ======================================

document.addEventListener("DOMContentLoaded", async () => {

  try {

    const res = await fetch("/api/auth/check", {
      credentials: "include"
    });

    if (!res.ok) {
      location.href = "/html/auth/login.html";
      return;
    }

    const data = await res.json();

    if (data.usuario.id_rol === 3) {

      document
      .getElementById("menuTrabajadores")
      .style.display = "none";

    }

  } catch (error) {

    location.href = "/html/auth/login.html";
    return;

  }

  cargarClientes();

});

// ======================================
// CARGAR CLIENTES
// ======================================

async function cargarClientes() {

  try {

    const res = await fetch(`${API}/clientes`, {
      credentials: "include"
    });

    const data = await res.json();

    if (!data.success) return;

    const select =
    document.getElementById("cliente");

    select.innerHTML =
    '<option value="">Seleccione cliente</option>';

    data.clientes.forEach(cliente => {

      select.innerHTML += `
        <option value="${cliente.id_clientes}">
          ${cliente.nombreCompleto}
        </option>
      `;

    });

  } catch (error) {

    console.error(error);

  }

}

// ======================================
// CALCULAR PRÉSTAMO
// ======================================

function calcularPrestamo() {

  const monto =
  parseFloat(
    document.getElementById("monto").value
  ) || 0;

  const interes =
  parseFloat(
    document.getElementById("interes").value
  ) || 0;

  const cuotas =
  parseInt(
    document.getElementById("cuotas").value
  ) || 0;

  const fechaInicio =
  document.getElementById("fecha_inicio").value;

  const total =
  monto + (monto * interes / 100);

  const cuota =
  cuotas > 0 ? total / cuotas : 0;

  document.getElementById("totalPagar")
  .textContent =
  "$" + total.toLocaleString();

  document.getElementById("cuotaDiaria")
  .textContent =
  "$" + cuota.toFixed(2);

  if (fechaInicio && cuotas > 0) {

    const fecha =
    new Date(fechaInicio);

    fecha.setDate(
      fecha.getDate() + cuotas
    );

    document.getElementById("fechaFinal")
    .textContent =
    fecha.toLocaleDateString();

  } else {

    document.getElementById("fechaFinal")
    .textContent = "--";

  }

}

// ======================================
// EVENTOS CALCULADORA
// ======================================

[
  "monto",
  "interes",
  "cuotas",
  "fecha_inicio"
]
.forEach(id => {

  document
  .getElementById(id)
  .addEventListener("input", calcularPrestamo);

});

// ======================================
// GUARDAR PRÉSTAMO
// ======================================

document
.getElementById("formPrestamo")
.addEventListener("submit", async (e) => {

  e.preventDefault();

  const body = {

    id_clientes:
    document.getElementById("cliente").value,

    monto:
    document.getElementById("monto").value,

    interes:
    document.getElementById("interes").value,

    numero_cuotas:
    document.getElementById("cuotas").value,

    fecha_inicio:
    document.getElementById("fecha_inicio").value

  };

  try {

    const res = await fetch(`${API}/prestamos`, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      credentials: "include",

      body: JSON.stringify(body)

    });

    const data = await res.json();

    if (data.success) {

      alert("Préstamo creado correctamente");

      document
      .getElementById("formPrestamo")
      .reset();

      calcularPrestamo();

    } else {

      alert(data.message || "Error");

    }

  } catch (error) {

    alert("Error del servidor");

  }

});

// ======================================
// LOGOUT
// ======================================

document
.getElementById("btnLogout")
.addEventListener("click", async () => {

  await fetch("/api/auth/logout", {

    method: "POST",
    credentials: "include"

  });

  localStorage.clear();
  sessionStorage.clear();

  location.href =
  "/html/auth/login.html";

});
</script>

</body>
</html>
