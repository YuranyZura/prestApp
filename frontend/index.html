<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PrestApp</title>

  <!-- CSS GLOBAL -->
  <link
    rel="stylesheet"
    href="/src/css/global.css"
  />

  <link
    rel="stylesheet"
    href="/src/css/login.css"
  />
</head>

<body>

  <!-- APP -->
  <div id="app">

    <div class="login-container">

      <h1>PrestApp</h1>

      <form id="loginForm">

        <input
          type="email"
          id="correo"
          placeholder="Correo"
          required
        />

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        />

        <button type="submit">
          Iniciar sesión
        </button>

      </form>

    </div>

  </div>

  <!-- JS -->
  <script
    type="module"
    src="/src/js/auth/login.js"
  ></script>

</body>

</html>
