version: '3.9'

services:

  backend:
    build: ./backend

    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prestapp

    ports:
      - "3306:3306"